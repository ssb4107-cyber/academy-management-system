<style id="appThemeStyle">
  :root{--app-navy:#17365d;--app-blue:#1a73e8;--app-blue-2:#4285f4;--app-soft:#e8f0fe;--app-bg:#f3f6fb;--app-line:#dfe5ec;--app-ink:#202124;--app-muted:#5f6875;--app-green:#188038;--app-red:#d93025;--app-amber:#b06000}
  body{background-color:var(--app-bg)!important;color:var(--app-ink);font-family:Arial,'Noto Sans KR',sans-serif!important}
  .top,.header{background:linear-gradient(120deg,var(--app-navy),var(--app-blue))!important;color:#fff!important;box-shadow:0 4px 15px rgba(22,50,92,.2)}
  .top{min-height:66px;padding-left:70px!important}.header{padding-left:70px!important}
  .top h1,.header h1{color:#fff!important}.top p,.header p{color:rgba(255,255,255,.78)!important}
  .panel,.card,.summary-card,.quick-card{border-color:var(--app-line)!important;box-shadow:0 3px 12px rgba(40,64,100,.065)}
  .card strong,.summary-card strong,.panel h2,.panel-head h2{color:var(--app-navy)}
  .toolbar,.table-wrap,.item,.step-box{border-color:var(--app-line)!important;border-radius:11px!important}.toolbar{background:#fff!important;box-shadow:0 2px 9px rgba(40,64,100,.045)}
  th{background:#f4f7fb!important;color:#526175!important}.dialog{border-radius:15px!important}.dialog-head{border-color:var(--app-line)!important}.notice,.info-box,.tip{border-radius:10px!important}.notice:not(.protected):not(.result-ok):not(.result-warn):not(.error):not(.warning){background:var(--app-soft)!important;color:#174ea6!important}
  button,.btn,a.btn{font-family:inherit;border-radius:7px}button.primary,.btn.primary,.btn-primary,.btn-submit,.btn-search,.btn-save,.btn-print,.btn-group{background:var(--app-blue)!important;color:#fff!important}button.secondary,.btn.secondary,.btn-soft,.btn.soft,.refresh,.btn-close,.btn-back,.btn-cancel{background:var(--app-soft)!important;color:#174ea6!important}button.danger,.btn.danger,.btn-danger,.btn-ungroup{background:#fce8e6!important;color:var(--app-red)!important;border-color:#f3b7b2!important}button.success,.btn.success{background:#e6f4ea!important;color:var(--app-green)!important}
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid rgba(26,115,232,.22);outline-offset:1px;border-color:var(--app-blue)!important}
  @media print{.top,.header{padding-left:20px!important;box-shadow:none!important}}
</style>
