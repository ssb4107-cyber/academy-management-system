<script>
      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function(ch) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]; });
      }
      function salaryActionableError(error, action) {
        var message = error && error.message ? error.message : String(error || "");
        if (!message || message === "[object Object]") message = (action || "급여 작업") + " 중 알 수 없는 문제가 발생했습니다.";
        return message + "\n조회 월과 입력 금액을 확인한 뒤 다시 시도해주세요. 계속되면 화면을 새로고침하고 ‘설정 및 운영 관리 → 오류 자력 해결 안내’에 이 문구를 붙여넣어 다음 행동을 확인해주세요.";
      }
    var globalTeacherRate = 0; 
      var currentAdjustments = []; 
      var currentWrapperId = ""; 
      var salarySectionData = {};
      var salaryAdminRecords = [];
      var salaryAdminInitialized = false;
      var salaryAdminRecordsLoaded = false;
      var salaryUiBusy = false;
      var salaryMonthConfirmationResolver = null;

      function setSalaryUiBusy(busy) {
        salaryUiBusy = !!busy;
        var exportButton = document.getElementById("exportBtn");
        if (exportButton) exportButton.disabled = salaryUiBusy;
        var monthButton = document.getElementById("finalizeMonthBtn");
        if (monthButton) monthButton.disabled = salaryUiBusy;
      }

      function showSalaryPage(page, button) {
        var calc = document.getElementById("salaryCalcPage");
        var records = document.getElementById("salaryAdminPage");
        calc.style.display = page === "calc" ? "block" : "none";
        records.style.display = page === "records" ? "block" : "none";
        if (page === "records") {
          var selectedYm = document.getElementById("targetMonth").value;
          if (selectedYm) document.getElementById("smBatchPaymentYm").value = selectedYm;
          if (selectedYm && !document.getElementById("smFilterMonth").value) document.getElementById("smFilterMonth").value = selectedYm;
        }
        document.querySelectorAll(".salary-tab").forEach(function(item) { item.classList.remove("active"); });
        if (button) button.classList.add("active");
        if (page === "records" && !salaryAdminInitialized) salaryAdminLoad();
      }

      function salaryYmLabel(value) {
        var match = String(value || "").match(/^(\d{4})-(\d{2})$/);
        return match ? String(Number(match[1]) % 100) + "." + String(Number(match[2])) : String(value || "-");
      }

      function salarySignedMoney(value) {
        var amount = Number(value || 0);
        return (amount > 0 ? "+" : "") + amount.toLocaleString() + "원";
      }

      function showSalaryMonthConfirmation(ym, items, total) {
        document.getElementById("salaryMonthConfirmTitle").textContent = salaryYmLabel(ym) + "월 원장 급여를 확정하시겠습니까?";
        var summary = document.getElementById("salaryMonthConfirmSummary");
        summary.innerHTML = '<span>' + escapeHtml(items.length + "명 · 원장 급여 총액") + '</span><strong>' + Number(total || 0).toLocaleString() + '원</strong>';
        document.getElementById("salaryMonthConfirmList").innerHTML = items.map(function(item) {
          var preview = item.preview;
          var teacherName = String(preview.teacher.name || "").trim();
          var teacherLabel = /원장$/.test(teacherName) ? teacherName : teacherName + "원장";
          var adjustmentAmount = Number(preview.adjustmentAmount || 0);
          var adjustments = (Array.isArray(preview.adjustments) ? preview.adjustments : []).map(function(adjustment) {
            return {
              label: String(adjustment.typeText || "급여 조정").trim(),
              note: String(adjustment.note || "사유 미입력").trim(),
              amount: Number(adjustment.finalAmount || 0)
            };
          });
          var hasAmountAdjustments = adjustments.length > 0;
          var excludedStudents = {};
          (Array.isArray(preview.excluded) ? preview.excluded : []).forEach(function(student) {
            excludedStudents[String(student.studentId || "")] = String(student.name || "");
          });
          (Array.isArray(preview.exclusions) ? preview.exclusions : []).forEach(function(exclusion) {
            var id = String(exclusion.studentId || "");
            adjustments.push({
              label: "선입금 제외",
              note: (excludedStudents[id] || "학생 정보 확인 필요") + (exclusion.reason ? " · " + exclusion.reason : ""),
              amount: null
            });
          });
          var totalBadge = hasAmountAdjustments
            ? '<span class="salary-confirm-adjustment-total' + (adjustmentAmount < 0 ? ' minus' : '') + '">조정 ' + escapeHtml(salarySignedMoney(adjustmentAmount)) + '</span>'
            : "";
          var detailHtml = adjustments.length ? '<div class="salary-confirm-adjustments">' + adjustments.map(function(adjustment) {
            return '<div class="salary-confirm-adjustment-row"><span class="salary-confirm-adjustment-label">' + escapeHtml(adjustment.label) + '</span><span class="salary-confirm-adjustment-note">' + escapeHtml(adjustment.note) + '</span><span class="salary-confirm-adjustment-money">' + (adjustment.amount == null ? "급여 제외" : escapeHtml(salarySignedMoney(adjustment.amount))) + '</span></div>';
          }).join("") + '</div>' : '<div class="salary-confirm-none">조정 사항 없음</div>';
          return '<section class="salary-confirm-card"><div class="salary-confirm-card-head"><div><span class="salary-confirm-teacher">' + escapeHtml(teacherLabel) + '</span>' + totalBadge + '</div><span class="salary-confirm-amount">' + Number(preview.finalAmount || 0).toLocaleString() + '원</span></div>' + detailHtml + '</section>';
        }).join("");
        document.getElementById("salaryMonthConfirmModal").style.display = "flex";
        document.getElementById("salaryMonthConfirmSubmit").focus();
        return new Promise(function(resolve) { salaryMonthConfirmationResolver = resolve; });
      }

      function finishSalaryMonthConfirmation(confirmed) {
        document.getElementById("salaryMonthConfirmModal").style.display = "none";
        var resolve = salaryMonthConfirmationResolver;
        salaryMonthConfirmationResolver = null;
        if (resolve) resolve(!!confirmed);
      }

      function salaryIsLeavingNextMonthForDisplay(item, ym) {
        if (item && item.isLeavingNextMonth) return true;
        var ymMatch = String(ym || "").match(/^(\d{4})-(\d{2})$/);
        var exitMatch = String((item && item.exitDate) || "").match(/^(\d{4})[.-](\d{2})[.-](\d{2})$/);
        if (!ymMatch || !exitMatch) return false;
        var nextMonth = new Date(Number(ymMatch[1]), Number(ymMatch[2]), 1);
        return Number(exitMatch[1]) === nextMonth.getFullYear() && Number(exitMatch[2]) === nextMonth.getMonth() + 1;
      }

      function salaryNoteForDisplay(item) {
        var lines = String((item && item.vacationDetails) || "").split(/\r?\n/).filter(function(line) { return String(line).trim(); });
        var specialOnly = !!(item && item.specialOnly) || (item && item.calculationBasis === "특강비만" && Number(item.fee || 0) === 0);
        var specialOnlyBasis = item && item.calculationBasis === "특강비만";
        var hasLegacyExplanation = lines.some(function(line) { return line.indexOf("특강비만 수납되어 수강료 매출은 0원 적용") >= 0; });
        lines = lines.filter(function(line) { return line.indexOf("특강비만 수납되어 수강료 매출은 0원 적용") < 0; });
        lines = lines.map(function(line) {
          if (line.indexOf("🎁 ") !== 0) return line;
          if (specialOnly) {
            if (line.indexOf("🎁 특강전용 학생 · ") === 0) return line;
            var specialText = line.substring(3).replace(/^특강전용\s*·\s*/, "");
            specialText = specialText.replace(/^특강비\s+/, "특강매출 ");
            return "🎁 특강전용 학생 · " + specialText;
          }
          if (!specialOnly && specialOnlyBasis && hasLegacyExplanation && line.indexOf("정규 수강료 매출 0원") < 0) return line + " · 정규 수강료 매출 0원";
          return line;
        });
        return lines.join("\n");
      }

      window.onload = function() {
        var today = new Date();
        today.setDate(1); 
        today.setMonth(today.getMonth() - 1);
        var yyyy = today.getFullYear();
        var mm = ("0" + (today.getMonth() + 1)).slice(-2);
        document.getElementById("targetMonth").value = yyyy + "-" + mm;
        document.getElementById("smBatchPaymentYm").value = yyyy + "-" + mm;
        var now = new Date();
        var todayText = now.getFullYear() + "-" + ("0" + (now.getMonth() + 1)).slice(-2) + "-" + ("0" + now.getDate()).slice(-2);
        document.getElementById("smDate").value = todayText;
        document.getElementById("smBatchPaymentDate").value = todayText;
        document.getElementById("smHistoryPaidDate").value = todayText;
        document.getElementById("smHistoryYm").value = now.getFullYear() + "-" + ("0" + (now.getMonth() + 1)).slice(-2);
        
        loadSalaryDashboardInitialData();
      };

</script>
