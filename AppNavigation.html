<style id="appNavStyle">
  #appNavToggle{position:fixed;left:12px;top:12px;z-index:12000;display:flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;border:1px solid rgba(255,255,255,.45);border-radius:12px;background:rgba(255,255,255,.96);color:var(--app-navy);box-shadow:0 3px 12px rgba(0,0,0,.16);cursor:pointer;line-height:1}
  #appNavToggle:hover{background:#fff}#appNavToggle:focus-visible,.app-nav-link:focus-visible{outline:3px solid rgba(26,115,232,.35);outline-offset:2px}
  .app-nav-hamburger{display:flex;flex-direction:column;align-items:center;justify-content:center;width:20px;height:16px;gap:4px;pointer-events:none}
  .app-nav-hamburger i{display:block;width:20px;height:2px;border-radius:2px;background:currentColor;transform:none;transition:transform .18s ease,opacity .18s ease}
  body.app-nav-open .app-nav-hamburger i:nth-child(1){transform:translateY(6px) rotate(45deg)}
  body.app-nav-open .app-nav-hamburger i:nth-child(2){opacity:0}
  body.app-nav-open .app-nav-hamburger i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  #appNavBackdrop{display:none;position:fixed;inset:0;z-index:11998;background:rgba(15,23,42,.28)}
  #appNavRoot{position:fixed;left:0;top:0;bottom:0;z-index:11999;width:min(310px,86vw);background:#fff;box-shadow:8px 0 28px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .2s ease;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;text-align:left;color:#202124;font:14px/1.4 Arial,'Noto Sans KR',sans-serif}
  body.app-nav-open{overflow:hidden}body.app-nav-open #appNavRoot{transform:translateX(0)}body.app-nav-open #appNavBackdrop{display:block}
  .app-nav-head{min-height:76px;padding:18px 18px 18px 68px;background:linear-gradient(120deg,var(--app-navy),var(--app-blue));color:#fff}.app-nav-head strong{display:block;font-size:18px;line-height:1.3}.app-nav-head span{display:block;margin-top:3px;font-size:12px;opacity:.86;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .app-nav-group{padding:14px 17px 5px;color:#7b8490;font-size:11px;font-weight:800;letter-spacing:.02em}
  .app-nav-link{display:flex;align-items:center;min-height:44px;gap:10px;margin:2px 7px;padding:10px 11px;border-radius:9px;color:#334155!important;text-decoration:none!important;font-weight:700;line-height:1.3}
  .app-nav-link:hover{background:#f1f5f9}.app-nav-link.active{background:var(--app-soft);color:#174ea6!important}
  .app-nav-icon{display:flex;align-items:center;justify-content:center;flex:0 0 24px;width:24px;height:24px;line-height:1;font-size:17px;filter:saturate(.72)}
  .app-nav-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .app-nav-badge,.main-request-badge{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:#c83b32;color:#fff;font-size:11px;font-weight:900;line-height:1;margin-left:auto}
  .main-request-badge{margin-left:8px;vertical-align:middle}
  .app-nav-logout{display:block;width:calc(100% - 28px);margin:16px 14px;padding:10px;border:1px solid #d9e0e6;border-radius:9px;background:#fff;color:#66727e;font-weight:700;cursor:pointer}.app-nav-logout:hover{background:#f7f9fa}
  @media(max-width:520px){#appNavToggle{left:9px;top:9px;width:40px;height:40px}.app-nav-head{padding-left:62px}.app-nav-link{min-height:46px}}
  @media print{#appNavToggle,#appNavBackdrop,#appNavRoot{display:none!important}}
  @media(prefers-reduced-motion:reduce){#appNavRoot,.app-nav-hamburger i{transition:none}}
</style>
<button id="appNavToggle" type="button" aria-label="전체 메뉴 열기" aria-expanded="false" aria-controls="appNavRoot" title="전체 메뉴">
  <span class="app-nav-hamburger" aria-hidden="true"><i></i><i></i><i></i></span>
</button>
<div id="appNavBackdrop"></div>
<aside id="appNavRoot" aria-label="전체 메뉴" aria-hidden="true">
  <div class="app-nav-head"><strong>학원비 관리</strong><span id="appNavUser">계정 확인 중...</span></div>
  <div id="appNavLinks"><div style="padding:20px;color:#777">메뉴 불러오는 중...</div></div><button id="appNavLogout" class="app-nav-logout" type="button">다른 Google 계정으로 전환</button>
</aside>
<script>
(function(){
  var body=document.body,toggle=document.getElementById('appNavToggle'),backdrop=document.getElementById('appNavBackdrop'),root=document.getElementById('appNavRoot'),links=document.getElementById('appNavLinks');
  function setOpen(open){body.classList.toggle('app-nav-open',open);toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'전체 메뉴 닫기':'전체 메뉴 열기');root.setAttribute('aria-hidden',String(!open));root.inert=!open}
  function close(){setOpen(false)}
  toggle.addEventListener('click',function(){setOpen(!body.classList.contains('app-nav-open'))});
  backdrop.addEventListener('click',close);
  document.getElementById('appNavLogout').addEventListener('click',function(){var button=this;button.disabled=true;button.textContent='계정 선택 화면 여는 중...';google.script.run.withSuccessHandler(function(result){if(!result||!result.redirectUrl){button.disabled=false;button.textContent='다른 Google 계정으로 전환';alert('계정 선택 주소를 만들지 못했습니다. 화면을 새로고침한 뒤 다시 시도해주세요.');return}window.top.location.href=result.redirectUrl}).withFailureHandler(function(error){button.disabled=false;button.textContent='다른 Google 계정으로 전환';alert(((error&&error.message)||error||'계정 선택 화면을 열지 못했습니다.')+'\n화면을 새로고침한 뒤 다시 시도해주세요.')}).logoutWebAppSession()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
  setOpen(false);
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function badgeText(value){var n=Math.max(0,Number(value)||0);return n>99?'99+':String(n)}
  function currentPage(){try{return new URL(window.location.href).searchParams.get('page')||''}catch(e){return''}}
  var navigationApplied=false,navigationRequested=false;
  function renderNavigationState(state){
    navigationApplied=true;
    document.getElementById('appNavUser').textContent=state.userName+(state.isSuperAdmin?' · 최고 원장':' · 관리 원장님');
    var page=currentPage(),current='',html='';
    (state.menus||[]).forEach(function(m){
      if(m.group!==current){current=m.group;html+='<div class="app-nav-group">'+esc(current)+'</div>'}
      var menuPage='';try{menuPage=new URL(m.url).searchParams.get('page')||''}catch(e){}
      var active=menuPage===page;
      html+='<a class="app-nav-link'+(active?' active':'')+'" '+(active?'aria-current="page" ':'')+'target="_top" href="'+esc(m.url)+'"><span class="app-nav-icon">'+esc(m.icon)+'</span><span class="app-nav-label">'+esc(m.label)+'</span>'+(m.badge?'<span class="app-nav-badge" aria-label="대기 요청 '+esc(m.badge)+'건">'+esc(badgeText(m.badge))+'</span>':'')+'</a>';
    });
    links.innerHTML=html;
    var ids={change:'mainChangeRequestBadge',payment:'mainPaymentRequestBadge',total:'mainTotalRequestBadge'};
    Object.keys(ids).forEach(function(k){var el=document.getElementById(ids[k]),n=Number(state.counts&&state.counts[k]||0);if(el){el.textContent=badgeText(n);el.style.display=n?'inline-flex':'none'}});
  }
  function requestNavigationState(){
    if(navigationRequested||navigationApplied)return;
    navigationRequested=true;
    google.script.run.withSuccessHandler(renderNavigationState).withFailureHandler(function(){links.innerHTML='<div style="padding:20px;color:#b3261e">메뉴를 불러오지 못했습니다.<br>화면을 새로고침하고, 계속되면 승인된 Google 계정인지 확인해주세요.</div>'}).getAppNavigationState();
  }
  window.applyAppNavigationState=renderNavigationState;
  // 대시보드는 본문 응답에 메뉴 상태가 함께 오므로, 느린 최초 조회 중 중복 서버 호출을 피합니다.
  if(window.deferAppNavigationState===true)setTimeout(requestNavigationState,12000);
  else requestNavigationState();
})();
</script>
