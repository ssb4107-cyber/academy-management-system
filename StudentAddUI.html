<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Noto Sans KR', sans-serif; padding: 20px; background-color: #f8f9fa; }
      h3 { margin: 0; color: #1a73e8; font-size: 18px; }
      .form-title-row { display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:2px solid #1a73e8; padding-bottom:10px; margin-bottom:4px; }
      .course-mode-toggle { display:inline-flex; flex:0 0 auto; padding:2px; border:1px solid #c7d2e3; border-radius:999px; background:#eef2f7; }
      .course-mode-toggle button { width:auto; flex:none; margin:0; padding:6px 9px; border-radius:999px; background:transparent; color:#5f6368; font-size:11px; line-height:1; white-space:nowrap; }
      .course-mode-toggle button.active { background:#1a73e8; color:#fff; box-shadow:0 1px 4px rgba(26,115,232,.25); }
      .course-mode-help { margin:5px 1px 9px; text-align:right; color:#5f6368; }
      label { display: block; margin-top: 12px; font-size: 13px; color: #555; font-weight: bold; }
      .required { color: #d93025; margin-left: 2px; }
      input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #dadce0; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
      .row { display: flex; gap: 10px; }
      .col { flex: 1; }
      .btn-container { margin-top: 25px; display: flex; gap: 10px; }
      button { flex: 1; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
      #btnAdd { background-color: #1a73e8; color: white; }
      .btn-back { 
          flex: 1; /* 핵심: 등록하기 버튼과 1:1 비율로 공간 차지 */
         padding: 12px; 
          border-radius: 5px; 
         font-weight: bold; 
          background-color: #e0e0e0; /* 예전 취소 버튼 회색 */
          color: #333 !important; 
          text-decoration: none; 
          display: flex; 
          justify-content: center; 
          align-items: center; 
         box-sizing: border-box; 
        }

        /* ★ 바로가기 단축 버튼 스타일 */
      .btn-shortcut {
        display: inline-block;
        padding: 6px 12px;
        margin-top: 8px;
        background-color: #e67e22; /* 시선을 끄는 오렌지색 계열 */
        color: white !important;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
        font-size: 12px;
        text-align: center;
        cursor: pointer;
        border: none;
      }
      .btn-shortcut:hover {
        background-color: #d35400;
      }

      /* ★ 중복 경고 메시지 스타일 */
      #dupMsg { font-size: 12px; margin-top: 5px; display: none; }
      .warning { color: #d93025; font-weight: bold; }
      .safe { color: #137333; font-weight: bold; }
      input[readonly] { background-color: #f1f3f4; color: #777; cursor: not-allowed; border-color: #e0e0e0; }
      .info-text { font-size: 11px; margin-top: 3px; }
      .proration-preview { margin-top:8px; padding:10px 12px; border:1px solid #aecbfa; border-radius:6px; background:#e8f0fe; color:#174ea6; font-size:12px; line-height:1.55; font-weight:bold; }
      .proration-preview .preview-note { display:block; margin-top:2px; color:#5f6368; font-size:10px; font-weight:normal; }
    </style>
  </head>
  <body>
    <div class="form-title-row">
      <h3>🎓 신규 학생 등록</h3>
      <div class="course-mode-toggle" role="group" aria-label="수강 형태">
        <button type="button" class="active" data-course-mode="정규" onclick="setCourseMode('정규')">정규</button>
        <button type="button" data-course-mode="특강전용" onclick="setCourseMode('특강전용')">특강전용</button>
      </div>
    </div>
    <input type="hidden" id="courseMode" value="정규">
    <div id="courseModeHelp" class="info-text course-mode-help">정규 수강료의 월별 납부 대상으로 관리합니다.</div>

    <div class="row">
      <div class="col" style="flex:2">
        <label>학생명 <span class="required">*</span></label>
        <input type="text" id="name" placeholder="예: 홍길동" autocomplete="off" onblur="checkDuplicate()">
        <div id="dupMsg"></div>
      </div>
      <div class="col" style="flex:1">
        <label>현재 학년 <span class="required">*</span></label>
        <select id="gradeSelect" onchange="suggestDefaultFee()">
          <option value="1">고3</option>
          <option value="2">고2</option>
          <option value="3" selected>고1</option>
          <option value="4">중3</option>
          <option value="5">중2</option>
          <option value="6">중1</option>
          <option value="7">초6</option>
          <option value="8">초5</option>
          <option value="9">초4</option>
          <option value="10">초3</option>
          <option value="11">초2</option>
          <option value="12">초1</option>
          <option value="0">기타(성인)</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>첫 수업일 <span class="required">*</span></label>
        <input type="date" id="firstDate" onchange="autoSetBaseDay(); updateProratedPreview();">
      </div>
      <div class="col">
        <label>수강료 기준일 <span style="font-weight:normal;">(🔒)</span></label>
        <input type="number" id="baseDay" placeholder="자동 설정" readonly>
        <div class="info-text" style="color:#1a73e8;">ℹ️ 일할계산은 수납에서 진행해주세요.</div>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>기본 수강료 <span class="required">*</span></label>
        <input type="number" id="fee" value="400000" min="0" max="10000000" step="10000" oninput="updateProratedPreview()">
        <div id="feeSuggestion" class="info-text" style="color:#137333;">고등학생 권장 기본 수강료: 400,000원</div>
        <div id="proratedPreview" class="proration-preview" aria-live="polite"></div>
      </div>
      <div class="col">
        <label>배분률 (%) <span style="font-weight:normal;">(🔒)</span></label>
        <input type="number" id="distRate" value="60" readonly>
        <div class="info-text" style="color:#d93025;">⚠️ 변경 시 관리자 문의</div>
      </div>
    </div>

    <label>부모님 전화번호</label>
    <input type="text" id="parentPhone" placeholder="010-0000-0000">

    <label>담당 원장</label>
    <select id="teacher" onchange="applyTeacherDefaultRate()">
      <option value="">원장을 선택해주세요</option>
    </select>

    <div class="btn-container">
      <a href="<?= ScriptApp.getService().getUrl() ?>" 
     target="_top" 
     class="btn-back" 
     onclick="return smartClose(event);">
     ✖ 닫기
  </a>
      <button id="btnAdd" onclick="submitStudent()">등록하기</button>
    </div>

    <script>
      // 대시보드가 같은 출처의 내부 iframe에 화면을 주입한 경우 부모의 Apps Script 연결을 재사용합니다.
      try {
        if ((!window.google || !window.google.script) && window.parent && window.parent.google) {
          window.google = window.parent.google;
        }
      } catch (bridgeError) {
        console.warn("학생 등록 화면의 서버 연결을 초기화하지 못했습니다.", bridgeError);
      }
      var embeddedMode = <?!= embedded ? "true" : "false" ?>;
      var duplicateRequestVersion = 0;
      var februaryBillingDays = Number(<?= OperationalSettings_getNumber_("FEBRUARY_BILLING_DAYS", DATE_MONEY_POLICY.FEBRUARY_BILLING_DAYS) ?>) || 30;
      var defaultFees = {
        elementary:Number(<?= OperationalSettings_getNumber_("ELEMENTARY_DEFAULT_FEE", 250000) ?>),
        middle:Number(<?= OperationalSettings_getNumber_("MIDDLE_DEFAULT_FEE", 350000) ?>),
        high:Number(<?= OperationalSettings_getNumber_("HIGH_DEFAULT_FEE", 400000) ?>)
      };
      var regularFeeBeforeSpecial = null;
      window.onload = function() {
        var today = new Date();
        document.getElementById('firstDate').valueAsDate = today;
        document.getElementById('baseDay').value = today.getDate();
        suggestDefaultFee();
        updateProratedPreview();

        google.script.run.withSuccessHandler(setTeacherList).withFailureHandler(function(error) {
          document.getElementById("teacher").innerHTML = '<option value="">원장 목록을 불러오지 못했습니다. 새로고침해주세요.</option>';
          alert(((error && error.message) || error || "원장 목록을 불러오지 못했습니다.") + "\n화면을 새로고침하고, 계속되면 최고 원장에게 원장 설정을 확인해달라고 요청해주세요.");
        }).getTeacherOptionsForStudentAdd();
      };

      var managedTeacherOptions = [];
      function setTeacherList(teachers) {
        var list = document.getElementById("teacher");
        list.innerHTML = "";
        managedTeacherOptions = teachers || [];
        list.appendChild(new Option(
          managedTeacherOptions.length ? "원장을 선택해주세요" : "활성 원장을 먼저 등록해주세요",
          ""
        ));
        managedTeacherOptions.forEach(function(t) {
          list.appendChild(new Option(t.name, t.id));
        });
      }

      function applyTeacherDefaultRate() {
        var teacherId = document.getElementById("teacher").value.trim();
        var found = managedTeacherOptions.find(function(item) { return item.id === teacherId; });
        document.getElementById("distRate").value = found ? found.defaultRate : 60;
      }

      function autoSetBaseDay() {
        var dateVal = document.getElementById("firstDate").value;
        if(dateVal) {
           var day = parseInt(dateVal.split("-")[2]); 
           document.getElementById("baseDay").value = day;
        }
      }

      function updateProratedPreview() {
        var preview = document.getElementById("proratedPreview");
        if (document.getElementById("courseMode").value === "특강전용") {
          preview.textContent = "특강 전용 학생은 정규 수강료 일할·미납 계산에서 제외됩니다. 특강비는 수납 화면에서 입력하세요.";
          return;
        }
        var firstDateText = document.getElementById("firstDate").value;
        var feeText = String(document.getElementById("fee").value || "").trim();
        var monthlyFee = Number(feeText);
        if (!firstDateText || !feeText || !isFinite(monthlyFee) || monthlyFee < 0) {
          preview.textContent = "첫 수업일과 수강료를 입력하면 첫 달 예상 일할 수강료가 표시됩니다.";
          return;
        }

        var parts = firstDateText.split("-").map(Number);
        var year = parts[0];
        var month = parts[1];
        var startDay = parts[2];
        var actualLastDay = new Date(year, month, 0).getDate();
        if (!year || month < 1 || month > 12 || startDay < 1 || startDay > actualLastDay) {
          preview.textContent = "첫 수업일을 확인해주세요.";
          return;
        }

        var billingDays = month === 2 ? februaryBillingDays : actualLastDay;
        var activeDays = actualLastDay - startDay + 1;
        if (month === 2) activeDays += februaryBillingDays - actualLastDay;
        activeDays = Math.max(0, Math.min(activeDays, billingDays));
        var amount = Math.round(monthlyFee * activeDays / billingDays);
        var monthLabel = month + "월 " + startDay + "일~" + actualLastDay + "일";
        preview.textContent = "첫 달 예상 일할 수강료: " + amount.toLocaleString("ko-KR") + "원 (" +
          monthLabel + ", " + activeDays + "일/" + billingDays + "일 기준)";
        var note = document.createElement("span");
        note.className = "preview-note";
        note.textContent = "안내용 예상액입니다. 실제 금액은 수납 화면에서 일할 계산을 선택해 확정해주세요.";
        preview.appendChild(note);
      }

      function handleCourseModeChange() {
        var specialOnly = document.getElementById("courseMode").value === "특강전용";
        var feeInput = document.getElementById("fee");
        feeInput.disabled = specialOnly;
        if (specialOnly) feeInput.value = "0";
        document.querySelectorAll("[data-course-mode]").forEach(function(button) {
          button.classList.toggle("active", button.dataset.courseMode === (specialOnly ? "특강전용" : "정규"));
        });
        document.getElementById("courseModeHelp").textContent = specialOnly
          ? "월 수강료 미납·수납률에서 제외하고, 실제 받은 특강비만 급여 정산에 반영합니다."
          : "정규 수강료의 월별 납부 대상으로 관리합니다.";
        if (specialOnly) {
          document.getElementById("feeSuggestion").textContent = "특강전용 학생의 정규 수강료는 0원으로 고정됩니다.";
        }
        updateProratedPreview();
      }

      function setCourseMode(mode) {
        var modeInput = document.getElementById("courseMode");
        var previousMode = modeInput.value;
        var normalized = mode === "특강전용" ? "특강전용" : "정규";
        var feeInput = document.getElementById("fee");
        if (normalized === "특강전용" && previousMode !== "특강전용") {
          regularFeeBeforeSpecial = feeInput.value;
        }
        modeInput.value = normalized;
        if (normalized === "정규" && previousMode === "특강전용") {
          feeInput.value = regularFeeBeforeSpecial == null ? "" : regularFeeBeforeSpecial;
          suggestDefaultFee(true);
        }
        handleCourseModeChange();
      }

      function suggestDefaultFee(preserveCurrentFee) {
        var select = document.getElementById("gradeSelect");
        var grade = select.options[select.selectedIndex].text;
        var fee = grade.indexOf("초") === 0 ? defaultFees.elementary : grade.indexOf("중") === 0 ? defaultFees.middle : grade.indexOf("고") === 0 ? defaultFees.high : 0;
        var label = grade.indexOf("초") === 0 ? "초등학생" : grade.indexOf("중") === 0 ? "중학생" : grade.indexOf("고") === 0 ? "고등학생" : "기타 과정";
        if (document.getElementById("courseMode").value === "특강전용") {
          document.getElementById("fee").value = "0";
          document.getElementById("feeSuggestion").textContent = "특강전용 학생의 정규 수강료는 0원으로 고정됩니다.";
          updateProratedPreview();
          return;
        }
        if (!preserveCurrentFee) document.getElementById("fee").value = fee || "";
        document.getElementById("feeSuggestion").textContent = fee ? label + " 권장 기본 수강료: " + fee.toLocaleString() + "원" : "기타 과정은 수강료를 직접 입력해주세요.";
        updateProratedPreview();
      }

      // ★ [신규 기능] 중복 이름 검사
      function checkDuplicate() {
        var name = document.getElementById("name").value.trim();
        var msgBox = document.getElementById("dupMsg");
        var requestVersion = ++duplicateRequestVersion;
        
        if (name.length < 2) {
          msgBox.style.display = "none";
          return;
        }

        // 서버에 이름이 있는지 물어봅니다
        google.script.run.withSuccessHandler(function(res) {
          if (requestVersion !== duplicateRequestVersion || document.getElementById("name").value.trim() !== name) return;
          if (res.exists) {
            // 중복이면 경고 표시
            msgBox.style.display = "block";
            msgBox.className = "warning";
            
            if (res.outOfScope) {
              msgBox.textContent = "⚠️ 같은 이름의 학생이 이미 등록되어 있습니다. 최고 원장에게 확인해주세요.";
            } else if (res.status === "퇴원") {
              // 주소 뒤에 &searchName=이름 을 추가로 붙여서 이동시킵니다.
              var targetUrl = "<?= ScriptApp.getService().getUrl() ?>?page=StudentEdit&searchName=" + encodeURIComponent(name);

              // ★ [수정 1] 끊어진 문자열을 한 줄로 올바르게 연결했습니다.
              msgBox.textContent = "";
              var warning = document.createElement("div");
              warning.textContent = "⚠️ '" + name + "(" + (res.grade || "") + ")' 학생은 이미 존재합니다 (상태: 퇴원). 신규 등록 대신 학생 정보 수정 메뉴를 이용하세요.";
              var shortcut = document.createElement("a");
              shortcut.href = targetUrl;
              shortcut.target = "_top";
              shortcut.className = "btn-shortcut";
              shortcut.textContent = "✏️ [학생 정보 수정] 메뉴로 이동";
              msgBox.appendChild(warning);
              if (res.canOpenEdit) msgBox.appendChild(shortcut);
            
            // ★ [수정 2] 불필요한 '}'를 제거하고 else 짝을 맞췄습니다.
            } else {
              msgBox.textContent = "⚠️ '" + name + "' 학생은 이미 재원 중입니다 (" + (res.grade || "") + ").";
            }
            
          } else {
            // 중복 아니면 숨김 (또는 안전 메시지)
            msgBox.style.display = "none";
          }
        }).withFailureHandler(function(error) {
          if (requestVersion !== duplicateRequestVersion) return;
          msgBox.style.display = "block";
          msgBox.className = "warning";
          msgBox.textContent = "이름 중복 확인을 완료하지 못했습니다. 잠시 후 이름을 다시 입력하거나 화면을 새로고침해주세요. (" + ((error && error.message) || error || "조회 오류") + ")";
        }).checkNameDuplicate(name);
      }

      function submitStudent() {
        var name = document.getElementById("name").value.trim();
        
        // 중복 경고 확인
        var msgBox = document.getElementById("dupMsg");
        if (msgBox.style.display === "block" && !confirm("⚠️ 이미 존재하는 이름입니다. 동명이인이 맞습니까?\n(기존 학생이라면 '취소' 후 [학생 정보 수정]을 이용하세요.)")) {
          return;
        }

        var gradeSelect = document.getElementById("gradeSelect");
        var gradeText = gradeSelect.options[gradeSelect.selectedIndex].text; 
        var gradeDiff = parseInt(gradeSelect.value);

        var firstDate = document.getElementById("firstDate").value;
        var baseDay = document.getElementById("baseDay").value;
        var fee = document.getElementById("fee").value;
        var distRate = document.getElementById("distRate").value;
        var parentPhone = document.getElementById("parentPhone").value.trim();
        var teacherId = document.getElementById("teacher").value.trim();
        var courseMode = document.getElementById("courseMode").value;

        if (!name) { alert("학생 이름을 입력해주세요."); return; }
        if (!firstDate) { alert("첫 수업일을 입력해주세요."); return; }
        if (!teacherId) { alert("담당 원장을 선택해주세요."); return; }

        // ★ [최적화] 학번 문자열 생성 로직
        var finalGradeStr = "";
        
        // 성인(value=0)인 경우 처리
        if (gradeDiff === 0) {
            finalGradeStr = "성인"; 
        } else {
            // 현재 연도 + 차이값 = 졸업 예정 연도 (예: 2025 + 3 = 2028년)
            var currentYear = new Date().getFullYear();
            var batchYear = currentYear + gradeDiff;
            // 연도 뒤 2자리 추출 (2028 -> 28)
            var shortYear = String(batchYear).slice(-2);
            
            finalGradeStr = shortYear + "학번-" + gradeText; 
        }

        // 전화번호 포맷팅
        if (parentPhone) {
          var cleanPhone = parentPhone.replace(/[^0-9]/g, '');
          if (cleanPhone.length >= 9) {
             parentPhone = cleanPhone.replace(/(\d{3})(\d{3,4})(\d{4})/, '$1-$2-$3');
          }
        }

        var studentData = {
          name: name,
          grade: finalGradeStr, // ★ 여기서 만든 문자열을 서버로 보냄
          firstDate: firstDate,
          baseDay: baseDay, 
          fee: fee,
          distRate: distRate + "%",
          parentPhone: parentPhone,
          teacherId: teacherId,
          courseMode: courseMode
        };


        var btn = document.getElementById("btnAdd");
        btn.innerText = "처리 중...";
        btn.disabled = true;

        // 서버로 전송
       // 서버로 전송
        google.script.run
          .withSuccessHandler(function(msg) {
             if (embeddedMode && window.parent) {
               window.parent.postMessage({type:"student-add-saved", message:msg || "등록되었습니다."}, "*");
               return;
             }
             alert(msg || "등록되었습니다.");
             resetForm();
          })
          .withFailureHandler(function(err) {
             var message = err && err.message ? err.message : String(err || "학생 등록 중 알 수 없는 문제가 발생했습니다.");
             alert(message + "\n입력한 이름·날짜·담당 원장을 확인한 뒤 다시 시도해주세요. 계속되면 화면을 새로고침하고 최고 원장에게 이 문구를 전달해주세요.");
             var btn = document.getElementById("btnAdd");
             btn.innerText = "등록하기";
             btn.disabled = false;
          })
          .createStudent(studentData);
      } // submitStudent 함수 끝

      // ★ 추가할 함수: 팝업/웹앱 호환 스마트 닫기 스위치
      function smartClose(event) {
        try {
          if (embeddedMode && window.parent) {
            event.preventDefault();
            window.parent.postMessage({type:"student-add-close"}, "*");
            return false;
          }
          if (window.top === window.self) return true; 
          
          if (document.referrer.indexOf("docs.google.com") !== -1) {
            event.preventDefault();     
            google.script.host.close(); 
            return false;
          }
          return true; 
        } catch(e) {
          event.preventDefault();
          google.script.host.close();
          return false;
        }
      }
