<!DOCTYPE html><html><head><base target="_top"><meta charset="UTF-8"><style>
body{font-family:Arial,sans-serif;padding:18px}.item{border:1px solid #ddd;border-radius:8px;padding:12px;margin:8px 0}button{background:#1a73e8;color:#fff;border:0;border-radius:5px;padding:7px 12px}.empty{color:#777}
</style></head><body><h3>휴지통</h3><p>삭제된 수납과 휴가·퇴원공백은 2개월 동안 보관됩니다.</p><div id="list">불러오는 중...</div>
<script>
function errorText(e,fallback){var message=(e&&e.message)||String(e||fallback);return message+'\n화면을 새로고침한 뒤 다시 시도해주세요. 계속되면 최고 원장에게 이 문구를 전달해주세요.'}function loadTrash(){google.script.run.withSuccessHandler(function(items){var box=document.getElementById('list');box.innerHTML='';if(!items.length){box.innerHTML='<p class="empty">복구 가능한 항목이 없습니다.</p>';return;}items.forEach(function(item){var div=document.createElement('div');div.className='item';var text=document.createElement('div');var kind=item.sourceSheet==='DB_수납'?'수납':'휴가·퇴원공백';if(item.studentId){var name=document.createElement('button');name.type='button';name.className='student-info-link';name.setAttribute('data-student-modal-id',item.studentId);name.textContent=item.studentName||'학생 정보 확인 필요';text.appendChild(name);text.appendChild(document.createTextNode(' / '+kind+' / 영구삭제 예정 '+item.purgeAt+' / 사유: '+(item.reason||'기록 없음')))}else{text.textContent=(item.studentName||'학생 정보 확인 필요')+' / '+kind+' / 영구삭제 예정 '+item.purgeAt+' / 사유: '+(item.reason||'기록 없음')}var btn=document.createElement('button');btn.textContent='복구';btn.onclick=function(){if(!confirm('이 '+kind+' 기록을 복구하시겠습니까?'))return;btn.disabled=true;google.script.run.withSuccessHandler(function(msg){alert(msg);loadTrash();}).withFailureHandler(function(e){alert(errorText(e,'복구하지 못했습니다.'));btn.disabled=false;}).restoreTrashItem(item.trashId);};div.appendChild(text);div.appendChild(btn);box.appendChild(div);});}).withFailureHandler(function(e){document.getElementById('list').textContent=errorText(e,'휴지통을 불러오지 못했습니다.');}).getTrashItems();}loadTrash();
</script><?!= includeHtml_("StudentInfoModalCommon"); ?><?!= includeHtml_("AppGlossary"); ?>
</body></html>
