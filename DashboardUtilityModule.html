<script>
      // [추가] 도움말 열기 함수
      function openHelp() {
        var frame = document.getElementById("helpFrame");
        // 처음 열 때만 내용을 로딩합니다 (깜빡임 방지)
        if (!frame.src) {
           // 구글 스크립트의 HTML 내용을 iframe에 주입
           google.script.run.withSuccessHandler(function(htmlContent) {
             var doc = frame.contentWindow.document;
             doc.open();
             doc.write(htmlContent);
             doc.close();
           }).withFailureHandler(function(error) {
             var doc = frame.contentWindow.document;
             doc.open();
             doc.write('<!doctype html><html><body style="font-family:Arial,sans-serif;color:#c5221f;padding:30px;">도움말을 불러오지 못했습니다.<br><br>' + escapeHtml((error && error.message) || error || "조회 오류") + '<br><br>창을 닫고 다시 열거나 화면을 새로고침해주세요.</body></html>');
             doc.close();
           }).getHelpContent(); // 백엔드에 이 함수 추가 필요
        }
        document.getElementById("helpOverlay").style.display = "flex";
      }

      // [추가] 도움말 닫기 함수
      function closeHelp() {
        document.getElementById("helpOverlay").style.display = "none";
      }

      function openStudentAddModal(event) {
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }
        var frame = document.getElementById("studentAddFrame");
        document.getElementById("studentAddModal").style.display = "flex";
        if (frame.dataset.loaded === "1" || frame.dataset.loading === "1") return;

        frame.dataset.loading = "1";
        var loadingDoc = frame.contentWindow.document;
        loadingDoc.open();
        loadingDoc.write('<!doctype html><html><body style="font-family:Arial,sans-serif;color:#5f6368;text-align:center;padding-top:70px;">학생 등록 화면을 불러오는 중...</body></html>');
        loadingDoc.close();

        google.script.run
          .withSuccessHandler(function(htmlContent) {
            frame.dataset.loading = "";
            var doc = frame.contentWindow.document;
            doc.open();
            doc.write(htmlContent);
            doc.close();
            frame.dataset.loaded = "1";
          })
          .withFailureHandler(function(error) {
            frame.dataset.loading = "";
            var message = error && error.message ? error.message : String(error || "알 수 없는 오류");
            var doc = frame.contentWindow.document;
            doc.open();
            doc.write('<!doctype html><html><body style="font-family:Arial,sans-serif;color:#c5221f;padding:30px;">등록 화면을 불러오지 못했습니다.<br><br>' + escapeHtml(message) + '<br><br>창을 닫고 다시 열거나 화면을 새로고침해주세요.</body></html>');
            doc.close();
          })
          .getStudentAddEmbeddedContent();
      }

      function closeStudentAddModal() {
        document.getElementById("studentAddModal").style.display = "none";
      }

      window.addEventListener("message", function(event) {
        var frame = document.getElementById("studentAddFrame");
        if (!frame || event.source !== frame.contentWindow || !event.data) return;
        if (event.data.type === "student-add-close") {
          closeStudentAddModal();
          return;
        }
        if (event.data.type === "student-add-saved") {
          closeStudentAddModal();
          frame.dataset.loaded = "";
          frame.dataset.loading = "";
          var doc = frame.contentWindow.document;
          doc.open();
          doc.write("");
          doc.close();
          showToast(event.data.message || "학생을 등록했습니다.", "success");
          manualLoadData();
        }
      });
      // [추가] X 버튼 기능
      function toggleClearBtn() {
        var val = document.getElementById("searchName").value;
        var btn = document.getElementById("btnSearchClear");
        btn.style.display = (val.length > 0 || !!frozenStudentFilterIds) ? "block" : "none";
      }

      function clearSearch() {
        var input = document.getElementById("searchName");
        input.value = "";
        releasePinnedStudentFilter();
        toggleClearBtn();   // 버튼 숨기기
        applySortAndFilter(); // 목록 초기화
        input.focus();      // 다시 입력할 수 있게 커서 두기
      }

      // --- [마법의 닫기/뒤로가기 함수] ---
      function smartClose(event) {
        try {
          // 1. 단독 웹페이지로 열렸을 때 -> a 태그의 href로 자연스럽게 메인 이동
          if (window.top === window.self) return true; 
          
          // 2. 구글 시트 내부의 팝업(모달) 창으로 열렸을 때 -> 이동 취소하고 창 닫기
          if (document.referrer.indexOf("docs.google.com") !== -1) {
            event.preventDefault();     
            google.script.host.close(); 
            return false;
          }
          return true;
        } catch(e) {
          event.preventDefault();
          google.script.host.close();
          return false;
        }
      }

      var debounceTimer;
      function handleSearchMovement(e) {
          releasePinnedStudentFilter();
          toggleClearBtn();
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(function() {
              applySortAndFilter();
          }, 350); // 입력이 잠깐 멈춘 뒤 마지막 검색어만 적용
      }

      function handleSearchKeydown(e) {
          if (e.key !== "Enter") return;
          releasePinnedStudentFilter();
          clearTimeout(debounceTimer);
          applySortAndFilter();
      }

      function freezeSearchResults(studentIds) {
          frozenStudentFilterIds = Array.from(new Set((studentIds || []).map(String)));
          frozenStudentFilterMap = {};
          frozenStudentFilterIds.forEach(function(studentId) { frozenStudentFilterMap[studentId] = true; });
          var input = document.getElementById("searchName");
          input.value = "";
          toggleClearBtn();
          input.focus();
      }

      function releasePinnedStudentFilter() {
          if (!frozenStudentFilterIds) return;
          frozenStudentFilterIds = null;
          frozenStudentFilterMap = null;
      }

      function showToast(message, type) {
          var container = document.getElementById("toastContainer");
          var toast = document.createElement("div");
          toast.className = "toast-message " + (type || "");
          var text = document.createElement("span");
          text.textContent = String(message || "처리되었습니다.");
          var close = document.createElement("button");
          close.type = "button";
          close.className = "toast-close";
          close.setAttribute("aria-label", "알림 닫기");
          close.textContent = "×";
          close.onclick = function() { if (toast.parentNode) toast.parentNode.removeChild(toast); };
          toast.appendChild(text);
          toast.appendChild(close);
          container.appendChild(toast);
          setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 4200);
      }

      function actionableErrorMessage(error, action) {
        var message = error && error.message ? error.message : String(error == null ? "" : error);
        if (!message || message === "[object Object]") message = (action || "작업") + " 중 알 수 없는 문제가 발생했습니다.";
        if (!/(확인|선택|입력|다시|새로고침|요청|문의|해주세요|하세요)/.test(message)) {
          message += "\n입력 내용을 확인한 뒤 다시 시도해주세요.";
        }
        return message + "\n계속되면 화면을 새로고침해주세요. 최고 원장은 ‘설정 및 운영 관리 → 오류 자력 해결 안내’에 이 문구를 붙여넣어 다음 행동을 확인할 수 있습니다.";
      }
</script>
