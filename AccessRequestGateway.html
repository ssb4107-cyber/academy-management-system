<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f8;color:#202124;font:14px Arial,'Noto Sans KR',sans-serif}
    .card{width:min(430px,calc(100% - 30px));padding:30px;background:#fff;border:1px solid #dfe5eb;border-radius:18px;box-shadow:0 10px 35px rgba(26,47,66,.12);text-align:center;box-sizing:border-box}
    .mark{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:#fef7e0;color:#a05a00;font-size:27px}
    h1{margin:0 0 10px;font-size:23px;color:#17365d}.desc{margin:0;color:#66727e;line-height:1.65;word-break:keep-all}
    .email{margin:20px 0;padding:13px;border:1px solid #d9e2ec;border-radius:10px;background:#f7f9fb;color:#17365d;font-weight:700;word-break:break-all}
    .guide{margin:0 0 20px;padding:14px;border-radius:10px;background:#eef4ff;color:#34495e;line-height:1.6;text-align:left}
    .actions{display:grid;gap:10px}.button{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:22px;text-decoration:none;font-weight:700;box-sizing:border-box}
    .primary{background:#1a73e8;color:#fff}.secondary{border:1px solid #c7cdd3;background:#fff;color:#27313a}.button:hover{filter:brightness(.97)}
    .status{margin-top:15px;padding:11px;border-radius:9px;background:#fce8e6;color:#a5271e;word-break:keep-all}.note{margin-top:18px;color:#8a949e;font-size:11px;line-height:1.55}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">🔐</div>
    <h1><?= statusTitle ?></h1>
    <p class="desc"><?= statusMessage ?></p>
    <div class="email"><?= email ?></div>
    <div class="guide">이 화면에서는 학생·수납·사용자 등 학원 업무 자료를 조회하지 않습니다. 최고 원장이 권한을 등록하거나 다시 활성화한 뒤 아래 버튼으로 확인해주세요.</div>
    <div class="actions">
      <a class="button primary" href="<?!= redirectUrl ?>" target="_blank" rel="noopener" onclick="if(window.top===window.self)this.target='_self'">권한 다시 확인</a>
      <? if (switchAuthorizationUrl) { ?>
        <a class="button secondary" href="<?!= switchAuthorizationUrl ?>" target="_blank" rel="noopener" onclick="if(window.top===window.self)this.target='_self'">다른 Google 계정 사용</a>
      <? } ?>
    </div>
    <? if (setupError) { ?><div class="status"><?= setupError ?></div><? } ?>
    <div class="note">권한 신청 시 위 Google 이메일을 최고 원장에게 알려주세요.</div>
  </main>
</body>
</html>
