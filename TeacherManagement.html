<!DOCTYPE html>
<html lang="ko"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--blue:#1a73e8;--navy:#17365d;--green:#137333;--red:#c5221f;--muted:#5f6368;--line:#dfe4ea;--bg:#f3f6fb}
*{box-sizing:border-box}body{font-family:Arial,'Noto Sans KR',sans-serif;margin:0;background:var(--bg);color:#202124}
.header{padding:22px 26px;background:linear-gradient(120deg,#17365d,#1a73e8);color:#fff}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:rgba(255,255,255,.75);font-size:13px}
main{max-width:1250px;margin:auto;padding:20px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.summary-card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px rgba(40,64,100,.07)}
.summary-card{padding:15px}.summary-card span{display:block;color:var(--muted);font-size:12px;font-weight:bold}.summary-card strong{display:block;margin-top:7px;font-size:24px;color:var(--navy)}
.panel{padding:18px;margin-bottom:16px}.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.panel-head h2{font-size:17px;margin:0;color:var(--navy)}.panel-head .tools{margin-left:auto;display:flex;gap:8px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:bold;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #c9cdd2;border-radius:8px;background:#fff}.span2{grid-column:span 2}
button{border:0;border-radius:8px;padding:10px 16px;font-weight:bold;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf2f8;color:#315278}.actions{display:flex;align-items:end;gap:8px}.hint{margin-top:10px;color:var(--muted);font-size:12px}
.table-wrap{overflow:auto;border:1px solid #edf0f3;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{padding:10px;border-bottom:1px solid #edf0f3;text-align:left}th{background:#f4f7fb;color:#526175;font-size:12px;position:sticky;top:0}tbody tr:hover{background:#f7faff}.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:bold}.on{background:#e6f4ea;color:var(--green)}.off{background:#fce8e6;color:var(--red)}
.modal{display:none;position:fixed;inset:0;z-index:30;background:rgba(20,31,46,.5);align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(760px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 18px 55px rgba(0,0,0,.28)}.dialog-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0 auto 0 0;color:var(--navy);font-size:18px}.dialog-body{padding:18px}.close{width:32px;height:32px;padding:0;border-radius:50%;background:#eef1f5;color:#555;font-size:19px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.empty,.loading{text-align:center;padding:42px;color:var(--muted)}#toast{position:fixed;right:20px;bottom:20px;display:none;padding:12px 16px;border-radius:9px;background:#202124;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:20}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr}.span2{grid-column:span 2}.header{padding:18px}.panel-head{align-items:flex-start;flex-wrap:wrap}.panel-head .tools{width:100%;margin-left:0}.panel-head input{width:100%}}
</style></head><body>
<header class="header"><h1>👩‍🏫 원장 관리</h1><p>학생 담당자 드롭다운과 급여 정산에서 사용하는 원장 기준정보를 관리합니다.</p></header>
<main>
 <section class="summary"><div class="summary-card"><span>전체 원장</span><strong id="countAll">-</strong></div><div class="summary-card"><span>활성 원장</span><strong id="countActive">-</strong></div><div class="summary-card"><span>급여 정산 대상</span><strong id="countSalary">-</strong></div></section>
 <section class="panel"><div class="panel-head"><h2>등록된 원장</h2><div class="tools"><button class="primary" onclick="openTeacherModal()">원장 추가</button><button id="prepareBtn" class="secondary" onclick="prepareTeachers()">기존 데이터에서 목록 보완</button><input id="searchText" placeholder="원장명 검색" oninput="renderTeachers()"><select id="statusFilter" onchange="renderTeachers()"><option value="">전체 상태</option><option value="active">활성</option><option value="inactive">비활성</option><option value="salary">급여 대상</option></select></div></div><div id="teacherList" class="loading">불러오는 중...</div></section>
</main>
<div id="teacherModal" class="modal" onclick="if(event.target===this)closeTeacherModal()"><div class="dialog"><div class="dialog-head"><h2 id="formTitle">원장 등록</h2><button class="close" onclick="closeTeacherModal()">×</button></div><div class="dialog-body"><input type="hidden" id="teacherId"><div class="grid">
 <div class="field"><label>원장명</label><input id="teacherName" maxlength="40" placeholder="이름 입력"></div><div class="field"><label>신규 학생 기본 배분율</label><input id="teacherRate" type="number" min="0" max="100" value="60"></div><div class="field"><label>근무 시작일</label><input id="teacherStart" type="date"></div><div class="field"><label>근무 종료일</label><input id="teacherEnd" type="date"></div><div class="field"><label>활성 상태</label><select id="teacherActive"><option value="true">활성</option><option value="false">비활성</option></select></div><div class="field"><label>급여 정산 대상</label><select id="teacherSalary"><option value="true">대상</option><option value="false">제외</option></select></div><div class="field span2"><label>메모</label><input id="teacherMemo" maxlength="500" placeholder="선택 입력"></div>
 </div><div class="hint">기본 배분율은 신규 학생 등록 시 초기값으로만 사용합니다. 사용하던 원장은 삭제하지 말고 비활성으로 전환하세요.</div><div class="dialog-actions"><button class="secondary" onclick="closeTeacherModal()">취소</button><button id="saveBtn" class="primary" onclick="saveTeacher()">저장</button></div></div></div></div>
<div id="toast"></div>
<script>
var teachers=[];
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function showToast(message,isError){var el=document.getElementById('toast');el.textContent=message;el.style.background=isError?'#c5221f':'#202124';el.style.display='block';clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){el.style.display='none'},2600)}
function fail(err){var message=(err&&err.message)||String(err||'작업 중 알 수 없는 문제가 발생했습니다.');showToast(message+' 입력 내용을 확인한 뒤 다시 시도해주세요. 계속되면 새로고침해주세요.',true)}
function loadTeachers(){document.getElementById('teacherList').innerHTML='<div class="loading">원장 목록을 불러오는 중...</div>';google.script.run.withSuccessHandler(function(list){teachers=list||[];updateSummary();renderTeachers()}).withFailureHandler(fail).getManagedTeachers()}
function updateSummary(){countAll.textContent=teachers.length+'명';countActive.textContent=teachers.filter(function(t){return t.active}).length+'명';countSalary.textContent=teachers.filter(function(t){return t.salaryTarget}).length+'명'}
function renderTeachers(){var q=String(searchText.value||'').trim().toLowerCase(),filter=statusFilter.value;var list=teachers.filter(function(t){if(q&&String(t.name).toLowerCase().indexOf(q)<0)return false;if(filter==='active'&&!t.active)return false;if(filter==='inactive'&&t.active)return false;if(filter==='salary'&&!t.salaryTarget)return false;return true});var el=document.getElementById('teacherList');if(!list.length){el.innerHTML='<div class="empty">조건에 맞는 원장이 없습니다.</div>';return}el.innerHTML='<div class="table-wrap"><table><thead><tr><th>원장명</th><th>상태</th><th>기본 배분율</th><th>급여 대상</th><th>근무 기간</th><th>메모</th><th></th></tr></thead><tbody>'+list.map(function(t){var index=teachers.indexOf(t);return '<tr><td><strong>'+esc(t.name)+'</strong></td><td><span class="badge '+(t.active?'on':'off')+'">'+(t.active?'활성':'비활성')+'</span></td><td>'+Number(t.defaultRate||0)+'%</td><td>'+(t.salaryTarget?'대상':'제외')+'</td><td>'+esc(t.startDate||'-')+' ~ '+esc(t.endDate||'-')+'</td><td>'+esc(t.memo||'-')+'</td><td><button class="secondary" onclick="editTeacher('+index+')">수정</button></td></tr>'}).join('')+'</tbody></table></div>'}
function openTeacherModal(){resetTeacher();teacherModal.classList.add('open')}
function closeTeacherModal(){teacherModal.classList.remove('open')}
function editTeacher(i){var t=teachers[i];teacherId.value=t.id;teacherName.value=t.name;teacherName.readOnly=true;teacherRate.value=t.defaultRate;teacherStart.value=t.startDate;teacherEnd.value=t.endDate;teacherActive.value=String(t.active);teacherSalary.value=String(t.salaryTarget);teacherMemo.value=t.memo||'';formTitle.textContent='원장 정보 수정';teacherModal.classList.add('open')}
function resetTeacher(){teacherId.value='';teacherName.value='';teacherName.readOnly=false;teacherRate.value=60;teacherStart.value='';teacherEnd.value='';teacherActive.value='true';teacherSalary.value='true';teacherMemo.value='';formTitle.textContent='원장 등록'}
function saveTeacher(){var btn=saveBtn;btn.disabled=true;btn.textContent='저장 중...';var d={id:teacherId.value,name:teacherName.value,defaultRate:teacherRate.value,startDate:teacherStart.value,endDate:teacherEnd.value,active:teacherActive.value==='true',salaryTarget:teacherSalary.value==='true',memo:teacherMemo.value};google.script.run.withSuccessHandler(function(){btn.disabled=false;btn.textContent='저장';closeTeacherModal();showToast('원장 정보를 저장했습니다.');resetTeacher();loadTeachers()}).withFailureHandler(function(e){btn.disabled=false;btn.textContent='저장';fail(e)}).saveManagedTeacher(d)}
function prepareTeachers(){var btn=prepareBtn;btn.disabled=true;btn.textContent='보완 중...';google.script.run.withSuccessHandler(function(report){btn.disabled=false;btn.textContent='기존 데이터에서 목록 보완';showToast(report.message||'원장 데이터를 보완했습니다.');loadTeachers()}).withFailureHandler(function(e){btn.disabled=false;btn.textContent='기존 데이터에서 목록 보완';fail(e)}).prepareTeacherDirectoryData()}
window.addEventListener('load',loadTeachers);
</script><?!= includeHtml_("AppGlossary"); ?>
</body></html>
