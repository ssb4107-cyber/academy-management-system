<style id="appGlossaryStyle">
  .app-term-help{display:inline-flex!important;align-items:center!important;justify-content:center!important;width:22px!important;height:22px!important;min-width:22px!important;min-height:22px!important;margin:0 0 0 5px!important;padding:0!important;border:1px solid #b8cbe5!important;border-radius:50%!important;background:#eef4fd!important;color:#23558a!important;font:700 12px/1 Arial,sans-serif!important;vertical-align:middle!important;cursor:help!important;box-shadow:none!important}
  .app-term-help:focus-visible,.app-glossary-footer button:focus-visible{outline:3px solid #7aa7e4;outline-offset:2px}
  th.app-term-host{white-space:normal!important}
  .app-glossary-footer{clear:both;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:18px 12px;padding:10px;color:#596779;font:13px/1.5 Arial,'Noto Sans KR',sans-serif}
  .app-glossary-footer button{padding:6px 10px;border:1px solid #c5d6ec;border-radius:8px;background:#eef4fd;color:#23558a;cursor:pointer;font:700 13px/1.5 Arial,sans-serif}
  #appGlossaryDialog{box-sizing:border-box;position:fixed;inset:0;width:min(580px,calc(100% - 24px));max-height:calc(100% - 32px);margin:auto;padding:0;border:1px solid #cfdbeb;border-radius:15px;background:#fff;color:#26364a;box-shadow:0 14px 60px #17365d40;font:15px/1.6 Arial,'Noto Sans KR',sans-serif;overflow:hidden;z-index:2147483647}
  #appGlossaryDialog[open]{display:flex;flex-direction:column}
  #appGlossaryDialog::backdrop{background:rgba(20,36,60,.4)}
  #appGlossaryDialog .app-glossary-head{display:flex;flex:0 0 auto;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;background:linear-gradient(120deg,#17365d,#1a73e8);color:#fff}
  #appGlossaryDialog h2{margin:0;color:#fff;font-size:19px}
  #appGlossaryDialog .app-glossary-close{width:34px;height:34px;padding:0;border:0;border-radius:8px;background:#ffffff24;color:#fff;cursor:pointer;font-size:23px}
  #appGlossaryDialog .app-glossary-body{display:flex;flex:1 1 auto;flex-direction:column;min-height:0;overflow:hidden;padding:16px 18px}
  #appGlossaryDialog label{display:block;flex:0 0 auto;margin-bottom:5px;font-size:13px;color:#53647b}
  #appGlossarySearch{box-sizing:border-box;flex:0 0 auto;width:100%;padding:11px 12px;border:1px solid #b8cbe5;border-radius:8px;background:#fff;color:#26364a;font:inherit}
  #appGlossaryResults{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin-top:12px;padding-right:5px}
  #appGlossaryResults article{padding:12px 0;border-bottom:1px solid #e7edf5}
  #appGlossaryResults article:last-child{border-bottom:0}
  #appGlossaryResults h3{margin:0 0 5px;color:#17365d;font-size:16px}
  #appGlossaryResults p{margin:4px 0}
  #appGlossaryResults .app-term-example{font-size:13px;color:#566a83;background:#f3f7fd;border-radius:7px;padding:8px 10px}
  #appGlossaryCount{display:block;flex:0 0 auto;margin-top:7px;color:#65758a;font-size:12px}
  @media print{.app-term-help,.app-glossary-footer,#appGlossaryDialog{display:none!important}}
</style>
<script>
(function(){
  'use strict';
  if(window.AppGlossary)return;
  // 표시 용어만 관리합니다. 금액 계산·권한값·서버 호출과 연결하지 않습니다.
  var terms=[
    ['귀속월',['수강료 해당 월','귀속 월'],'받은 돈이 어느 달 수강료인지 구분하는 월입니다. 실제 입금일과 다를 수 있습니다.','8월 31일에 받은 9월 수강료라면 납부일은 8월 31일, 귀속월은 9월입니다.'],
    ['납부일',['입금일'],'학생이나 보호자에게 실제로 돈을 받은 날짜입니다.','9월 수강료를 8월에 받았다면 납부일에는 실제 받은 8월 날짜를 적습니다.'],
    ['기준 월',[],'현재 화면에서 조회할 대상으로 선택한 월입니다.','수납 화면에서 8월을 고르면 그 달을 중심으로 이전 달·다음 달 내역을 함께 확인합니다.'],
    ['정산 월',[],'급여를 계산할 대상으로 선택한 수강 월입니다. 실제 급여 지급일과 다를 수 있습니다.','8월 수업에 대한 급여를 9월에 지급해도 정산 월은 8월입니다.'],
    ['학번',[],'같은 졸업 예정 연도의 학생을 묶는 표시입니다. 학생 개인의 고유번호가 아닙니다.','29학번-고1은 2029년 고등학교 졸업 예정인 고1을 뜻합니다.'],
    ['일할 계산',['일할계산','기간 계산'],'한 달 전체가 아니라 지정한 수강 기간에 해당하는 수강료를 계산하는 기능입니다.','중간 입학이나 퇴원 때 시작일·종료일과 휴가 적용 여부를 확인합니다.'],
    ['휴가 적용',[],'등록된 휴가 기간을 수강료 계산에서 제외하는 선택입니다. 해당 월에 겹치는 휴가를 확인하세요.','일할 기간을 직접 정하는 것과 휴가 기간을 빼는 것은 서로 다른 선택입니다.'],
    ['수강료 기준일',['수납 기준일','변경 기준일'],'학생에게 설정한 매월 수강료 기준 날짜입니다. 일할 계산의 기본 기간을 정할 때 쓰며, 실제 납부일과는 다릅니다.','기준일이 20이면 매월 20일이 기준입니다. 일할 저장 때 변경되는 기준일도 함께 확인하세요.'],
    ['적용일',['적용 월'],'바꾼 수강료·담당 원장 등의 새 값이 효력을 갖기 시작하는 날짜 또는 월입니다.','9월 1일 적용이면 8월 31일까지는 기존 값, 9월 1일부터는 새 값으로 봅니다.'],
    ['완납 허용 차이',['완납 오차'],'완납 여부를 판단할 때 인정하도록 설정한 작은 금액 차이입니다. 실제 받은 금액을 고치는 설정은 아닙니다.','현재 허용 금액은 설정 화면에서 확인합니다.'],
    ['일할 금액 차이 경고',['일할 금액 오차'],'직접 입력한 수납액이 일할 계산액과 크게 다를 때 확인을 요청하는 경고입니다. 완납 허용 차이와는 별개입니다.','계산액과 실제 받은 금액이 다르면 기간·할인·휴가를 확인합니다.'],
    ['2월 일할 기준일수',['2월 일할 기준','기준일수'],'일할 계산에서 한 달 몫을 나눌 때 사용하는 일수입니다. 달력의 실제 날짜 수와 다를 수 있습니다.','2월은 학원 설정의 기준일수를 사용합니다. 현재 값은 설정 화면을 확인하세요.'],
    ['납부 상태',[],'해당 월에 받을 금액과 수납 기록을 비교한 결과입니다.','완납은 납부 완료, 부분납은 일부 납부, 미납은 아직 납부되지 않은 상태를 가리킵니다.'],
    ['부분납',[],'해당 월에 받아야 할 금액 중 일부만 받은 상태입니다.','받을 금액이 35만원이고 20만원을 받았다면 나머지 금액을 확인합니다.'],
    ['미수',['미수 대상','부족액'],'받아야 하지만 아직 받지 못한 금액 또는 그 금액이 남은 학생입니다.','일부를 받은 학생도 미수 대상에 포함될 수 있습니다.'],
    ['초과 수납',[],'해당 월의 계산상 받을 금액보다 더 받은 부분입니다.','다음 달 선납인지, 할인이나 귀속월이 잘못 지정됐는지 먼저 확인합니다.'],
    ['배분율',['배분률','기본 배분율'],'급여 계산에서 학생 수강료의 정산 대상 금액 중 담당 원장 몫으로 계산하는 비율입니다.','60%는 정산 대상 금액의 60%입니다. 담당 기간·할인·조정에 따라 최종 급여는 달라질 수 있습니다.'],
    ['급여 정산',['정산'],'수강료·담당 기간·배분율·추가 및 공제 등을 모아 원장별 급여를 계산하는 일입니다.','계산, 확정, 실제 지급 기록은 서로 다른 단계입니다.'],
    ['확정 급여',['확정액','급여 확정','정산 확정','귀속 확정'],'계산 결과를 확인한 뒤 지급할 급여로 저장한 금액입니다. 실제 송금 완료를 뜻하지는 않습니다.','급여를 확정한 뒤 실제 지급한 날짜와 금액은 별도로 기록합니다.'],
    ['지급액',['실제 지급','기간 지급','지급 완료','지급완료'],'원장에게 지급했다고 기록한 금액입니다. 이 프로그램이 은행 송금을 실행하는 것은 아닙니다.','실제로 송금한 뒤 지급일과 금액을 기록하세요.'],
    ['미지급 잔액',['귀속 잔액','급여 잔액'],'확정한 급여 중 아직 지급하지 않은 것으로 기록된 금액입니다.','확정 100만원, 지급 70만원이면 남은 잔액은 30만원입니다.'],
    ['공제',[],'지급할 급여에서 빼는 조정입니다.','무엇 때문에 빼는지 메모를 함께 남기세요.'],
    ['과지급',[],'확정한 급여보다 더 지급한 것으로 기록된 금액입니다.','실제 송금액과 지급 기록을 비교한 뒤 필요한 조정을 합니다.'],
    ['귀속 수납률',[],'해당 월 수강료로 기록된 수납액을 그 월의 계산상 예상 수강료와 비교한 비율입니다.','입금한 달이 아니라 수강료 해당 월을 기준으로 봅니다.'],
    ['현금흐름 수납률',['현금흐름률'],'조회 기간에 실제 받은 수강료를 계산상 예상 수강료와 비교한 비율입니다.','과거 미납금이나 다음 달 선납금을 받으면 해당 월의 납부 완료 비율과 달라질 수 있습니다.'],
    ['규정 예상 수강료',['규정 예상액','규정 예상'],'학생 수강료와 수강 기간·휴가·할인 등을 기준으로 계산한 예상 금액입니다. 실제 입금액은 아닙니다.','실제로 받은 금액은 실수납 또는 수납 내역에서 확인합니다.'],
    ['학생·월',['재원·월'],'학생 수와 조회 개월을 함께 세는 단위입니다. 같은 학생이 여러 달 포함될 수 있습니다.','한 학생이 3개월 동안 포함되면 3학생·월이며 서로 다른 학생 3명이 아닙니다.'],
    ['퇴원공백',[],'퇴원한 뒤 다시 입학하기 전까지 학원을 다니지 않은 기간입니다. 일반 휴가와 구분합니다.','복귀한 학생의 과거 수강료·급여를 계산할 때 이 기간을 제외합니다.'],
    ['특강전용',['특강 전용'],'정규 월 수강료 납부 대상으로 관리하지 않고 특강비를 별도로 받는 수강 형태입니다.','정규 수강료 미납 대상에서는 제외되며 특강비는 수납 화면에서 입력합니다.'],
    ['수납 증빙',['납부 증빙','증빙'],'돈을 받았다는 사실을 확인할 수 있는 영수증이나 입금 내역 이미지입니다.','수납 요청에 첨부한 사진을 최고 원장이 확인할 수 있습니다.'],
    ['반려',[],'요청을 승인하지 않고 사유를 남겨 돌려보낸 상태입니다. 요청한 변경은 반영되지 않습니다.','반려 사유를 읽고 필요한 내용을 고친 뒤 다시 요청합니다.'],
    ['승인 대기',['확인 대기'],'요청은 접수됐지만 최고 원장이 아직 승인하거나 반려하지 않은 상태입니다.','요청 처리 현황에서 결과를 확인하세요.'],
    ['관리 원장님',[],'허용된 메뉴와 학생 범위에서 업무를 입력하고 필요한 변경을 승인 요청으로 보내는 계정 종류입니다.','학생의 담당 원장과 로그인 계정의 권한 이름은 서로 다른 개념입니다.'],
    ['최고 원장',[],'전체 관리와 요청 승인, 사용자 권한·운영 설정을 담당하는 계정 종류입니다.','관리 원장님의 요청을 승인하거나 반려할 수 있습니다.'],
    ['비상 관리자',['보호 계정'],'계정 설정에 문제가 생겼을 때도 관리 권한을 복구할 수 있도록 보호하는 최고 원장 계정입니다.','일반 계정처럼 권한을 낮추거나 사용 중지할 수 없습니다.'],
    ['담당 원장',[],'해당 학생의 수업을 맡는 원장입니다. 로그인 계정의 권한 이름과는 다릅니다.','학생 정보에서 담당 원장과 변경 적용일을 확인합니다.'],
    ['연결 원장',['선택한 원장'],'로그인 계정과 연결해 둔 원장 명부의 원장입니다. 연결한 원장에 따라 볼 수 있는 학생 범위가 정해집니다.','수업을 맡는 원장 명부와 로그인 계정은 별도로 관리합니다.'],
    ['사용자 종류',[],'로그인 계정이 어떤 권한으로 일할지 정하는 구분입니다.','관리 원장님은 허용된 범위에서 업무를 처리하고, 최고 원장은 전체 관리와 요청 승인을 담당합니다.'],
    ['월별 빠른 조회',['스냅샷','월별 조회 속도 기능'],'월별 계산 결과를 저장해 다음 조회 때 재사용하는 속도 기능입니다. 학생·수납 원본을 대신하는 백업이 아닙니다.','결과가 의심되면 새로고침하거나 사용을 중지하고 원본 계산으로 확인합니다.'],
    ['화면 임시정보',['캐시'],'빠른 화면 표시를 위해 잠시 보관한 조회 정보입니다.','임시정보를 지워도 학생과 수납 원본 기록은 삭제되지 않습니다.'],
    ['백업 복구',['관리 DB 복구','백업 검증·복구'],'선택한 백업 시점의 기록으로 현재 관리 데이터를 되돌리는 작업입니다. 단순 새로고침과 다릅니다.','백업 이후 기록이 사라지거나 변경될 수 있으므로 복구 영향 안내를 먼저 확인합니다.'],
    ['백업 검증',[],'백업의 구조와 내용을 검사해 복구에 사용할 수 있는지 확인하는 작업입니다. 검증만으로 현재 기록을 되돌리지는 않습니다.','검증 결과와 복구 영향 안내를 읽은 뒤 복구 여부를 결정합니다.'],
    ['관리 DB',['DB 시트','DB'],'학생·수납·휴가 등 프로그램의 원본 기록을 보관하는 스프레드시트의 관리용 시트입니다.','시트의 행이나 열을 직접 지우면 연결된 기록에 문제가 생길 수 있습니다.'],
    ['시점 이벤트',['이벤트'],'학생의 수강료·담당 원장 등이 언제부터 바뀌는지 남긴 변경 기록입니다.','과거 조회에는 그 당시 값, 미래 적용일 이후에는 바뀐 값을 계산하는 데 사용합니다.'],
    ['조회 인덱스',['인덱스'],'필요한 기록의 위치를 빨리 찾기 위해 만든 보조 정보입니다.','학생·수납 원본 자체나 백업을 뜻하는 것은 아닙니다.'],
    ['스키마',['DB 구조'],'관리용 시트에 어떤 열이 어떤 순서와 이름으로 있어야 하는지 정한 구조입니다.','헤더 불일치는 열 이름이나 위치가 프로그램의 예상과 다르다는 뜻입니다.'],
    ['데이터 상태 진단',['시스템 데이터 진단'],'현재 기록에 중복이나 잘못 연결된 항목이 있는지 검사하는 기능입니다.','진단 결과를 읽고 다음 행동을 확인합니다. 진단 통과가 모든 업무 내용의 정확성을 보장하지는 않습니다.'],
    ['배포 환경 점검',[],'실행 계정·시간대·파일 접근 등 웹앱이 작동할 환경을 검사하는 기능입니다.','데이터 내용 자체의 점검과는 구분해서 확인합니다.'],
    ['배포',[],'저장한 프로그램 코드를 접속자가 사용하는 웹앱 버전에 반영하는 작업입니다.','코드 저장만 했을 때와 실제 웹앱에 반영했을 때는 다를 수 있습니다.'],
    ['회귀 테스트',['통합 회귀 테스트'],'미리 준비한 사례로 기존 계산과 처리가 여전히 맞는지 확인하는 검사입니다.','검사 통과 후에도 실제 데이터 상태와 배포 환경은 따로 점검합니다.'],
    ['설정 기반시설 복구',[],'사용자·운영 설정을 보관하는 기본 구조가 손상됐을 때 점검하고 복구하는 기능입니다.','학생·수납 기록을 과거 시점으로 되돌리는 백업 복구와는 다릅니다.'],
    ['오류 ID',['진단 ID'],'오류나 점검 결과를 다시 찾을 수 있도록 붙인 식별 번호입니다.','문의를 남길 때 오류 문구와 발생 시각을 함께 보관하세요. 학생 번호나 비밀번호가 아닙니다.'],
    ['자동 운영',['자동 관리','트리거'],'정해진 시각에 백업이나 정리 작업이 자동 실행되도록 한 기능입니다.','정상 작동 여부는 설정 화면의 최근 실행 시각으로 확인합니다.']
  ].map(function(row){return {term:row[0],aliases:row[1],meaning:row[2],example:row[3]};});
  var selector='label,th,h1,h2,h3,summary,.modal-label,.role-mark,.summary-card>span,.admin-kpi>span,.kpi-label,.kpi-title,.stat-label,.tool>strong,.panel-title,.panel-title>span,.policy>b,.card .label,.setting-head>strong,.setting-head>b,[data-term]';
  var footer,dialog,search,results,count,lastFocus,observer;
  var pending=new Set(),timer=null;
  function normalized(text){return String(text||'').replace(/\s+/g,'').toLowerCase();}
  function findTerm(text){
    var value=normalized(text),best=null,bestLength=0;
    terms.forEach(function(item){[item.term].concat(item.aliases).forEach(function(alias){
      var key=normalized(alias);
      if(value.indexOf(key)!==-1&&key.length>bestLength){best=item;bestLength=key.length;}
    });});
    return best;
  }
  function render(){
    var query=normalized(search.value);
    var found=terms.filter(function(item){return normalized([item.term].concat(item.aliases,[item.meaning]).join(' ')).indexOf(query)!==-1;});
    results.replaceChildren();
    found.forEach(function(item){
      var card=document.createElement('article'),title=document.createElement('h3'),body=document.createElement('p'),example=document.createElement('p');
      title.textContent=item.term;body.textContent=item.meaning;example.textContent=item.example;example.className='app-term-example';
      card.append(title,body,example);results.appendChild(card);
    });
    count.textContent=found.length?'설명 '+found.length+'개':'찾는 용어가 없습니다. 검색어를 짧게 바꿔보세요.';
    results.scrollTop=0;
  }
  function open(term){
    lastFocus=document.activeElement;search.value=term||'';render();
    if(!dialog.open){if(dialog.showModal)dialog.showModal();else dialog.setAttribute('open','');}
    search.focus();search.select();
  }
  function close(){if(dialog.close)dialog.close();else{dialog.removeAttribute('open');restoreFocus();}}
  function restoreFocus(){if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
  function annotate(root){
    if(!root||root.nodeType!==1||root.closest('#appGlossaryDialog,.app-glossary-footer,[data-glossary-ignore]'))return;
    var nodes=[];if(root.matches(selector))nodes.push(root);
    root.querySelectorAll(selector).forEach(function(node){nodes.push(node);});
    nodes.forEach(function(node){
      if(node.closest('#appGlossaryDialog,.app-glossary-footer,[data-glossary-ignore],button,a,[contenteditable="true"]'))return;
      if(node.querySelector(selector))return;
      // 입력값·학생명·메모는 건드리지 않고 짧은 항목명만 읽습니다.
      var text=Array.from(node.childNodes).filter(function(child){return child.nodeType===3||(child.nodeType===1&&!child.matches('input,select,textarea,button'));}).map(function(child){return child.textContent;}).join(' ');
      if(normalized(text).length>70&&!node.hasAttribute('data-term'))return;
      var item=findTerm(node.getAttribute('data-term')||text);
      var help=node.querySelector(':scope > .app-term-help');
      if(help&&help.classList.contains('app-term-help')){
        if(!item){help.remove();node.classList.remove('app-term-host');return;}
      }else{
        if(!item)return;
        help=document.createElement('button');help.type='button';help.className='app-term-help';help.textContent='?';
        // 항목 안에 넣어 표·줄 배치를 보존합니다. 클릭은 별도로 처리해 입력값을 바꾸지 않습니다.
        node.appendChild(help);
      }
      help.dataset.appTermHelp=item.term;help.setAttribute('aria-label',item.term+' 뜻 보기');help.title=item.term+' 뜻 보기';
      node.classList.add('app-term-host');
    });
  }
  function queue(root){
    if(!root||root.nodeType!==1||root.closest('#appGlossaryDialog,.app-glossary-footer,.app-term-help'))return;
    if(!root.matches(selector)&&!root.querySelector(selector))return;
    pending.add(root);if(timer!==null)return;
    timer=setTimeout(function(){
      timer=null;var roots=Array.from(pending);pending.clear();
      // 내용이 바뀐 구역만 처리합니다. 수납 화면 전체를 반복 순회하지 않습니다.
      roots.filter(function(root,index){return root.isConnected&&!roots.some(function(other,j){return index!==j&&other.contains(root);});}).forEach(annotate);
    },80);
  }
  function start(){
    if(document.getElementById('appGlossaryDialog'))return;
    footer=document.createElement('div');footer.className='app-glossary-footer';
    var note=document.createElement('span');note.textContent='용어 옆 ?를 누르면 뜻을 볼 수 있습니다.';
    var all=document.createElement('button');all.type='button';all.textContent='용어 찾기';all.addEventListener('click',function(){open('');});footer.append(note,all);
    dialog=document.createElement('dialog');dialog.id='appGlossaryDialog';dialog.setAttribute('aria-labelledby','appGlossaryTitle');
    dialog.innerHTML='<div class="app-glossary-head"><h2 id="appGlossaryTitle">용어 도움말</h2><button type="button" class="app-glossary-close" aria-label="용어 도움말 닫기">×</button></div><div class="app-glossary-body"><label for="appGlossarySearch">궁금한 용어 검색</label><input id="appGlossarySearch" type="search" placeholder="예: 귀속월, 배분율, 반려"><small id="appGlossaryCount" role="status"></small><div id="appGlossaryResults" role="region" aria-label="용어 설명 목록" tabindex="0"></div></div>';
    document.body.append(footer,dialog);search=dialog.querySelector('input');results=dialog.querySelector('#appGlossaryResults');count=dialog.querySelector('#appGlossaryCount');
    search.addEventListener('input',render);dialog.querySelector('button').addEventListener('click',close);dialog.addEventListener('close',restoreFocus);
    // 도움말을 닫을 때 뒤쪽 수납·설정 창의 단축키까지 실행하지 않습니다.
    dialog.addEventListener('keydown',function(event){event.stopPropagation();if(event.key==='Escape'){event.preventDefault();close();}});
    dialog.addEventListener('click',function(event){if(event.target===dialog){var rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)close();}});
    document.addEventListener('click',function(event){var button=event.target.closest&&event.target.closest('[data-app-term-help]');if(!button)return;event.preventDefault();event.stopPropagation();open(button.dataset.appTermHelp);},true);
    annotate(document.body);
    observer=new MutationObserver(function(records){records.forEach(function(record){
      if(record.type==='characterData'){queue(record.target.parentElement);return;}
      record.addedNodes.forEach(function(node){if(node.nodeType===1)queue(node);else if(node.nodeType===3)queue(record.target);});
    });});
    observer.observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  window.AppGlossary={terms:terms,open:open,refresh:queue};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
