<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--navy:#23483f;--blue:#287b63;--sky:#e8f5f0;--green:#168447;--red:#c9372c;--amber:#b26a00;--ink:#1d2530;--muted:#6b7480;--line:#dfe5ed;--bg:#f3f8f6}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,'Noto Sans KR',sans-serif}
    button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:15px 20px;color:#fff;background:linear-gradient(125deg,var(--navy),var(--blue));box-shadow:0 4px 15px rgba(24,51,91,.2)}
    .brand{font-size:20px;font-weight:800;margin-right:auto}.role-mark{margin-left:8px;padding:4px 8px;border:1px solid rgba(255,255,255,.35);border-radius:12px;background:rgba(255,255,255,.14);font-size:11px;vertical-align:2px}.profile{text-align:right;font-size:12px;opacity:.9}.wrap{max-width:1280px;margin:auto;padding:18px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.soft{background:#e5f2ed;color:var(--navy)}.btn:disabled{opacity:.5;cursor:not-allowed}
    .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 13px rgba(34,57,88,.055)}.card{padding:15px}.card span{display:block;color:var(--muted);font-size:11px;font-weight:700}.card strong{display:block;margin-top:5px;color:var(--navy);font-size:23px}.card.pending{border-color:#f0c575;background:#fffaf0}.card.pending strong{color:var(--amber)}
    .grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(290px,.8fr);gap:14px}.panel{padding:16px;margin-bottom:14px}.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.panel-head h2{font-size:17px;color:var(--navy);margin:0 auto 0 0}.sub{font-size:12px;color:var(--muted)}
    .search{width:min(260px,100%);padding:9px 11px;border:1px solid var(--line);border-radius:9px}.filter-select{width:auto;min-width:135px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--navy);font-weight:700}.table-wrap{overflow:auto;max-height:620px;border:1px solid #edf0f4;border-radius:10px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px 9px;border-bottom:1px solid #edf0f4;text-align:left}th{position:sticky;top:0;background:#f6f8fb;color:#596575;font-size:12px}td.money{text-align:right;font-weight:700}.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:800}.badge.complete{background:#e7f5eb;color:#13733b}.badge.partial,.badge.pending{background:#fff3d6;color:#8a5300}.badge.unpaid{background:#fce8e6;color:#b3261e}.badge.special{background:#eee8ff;color:#6143a7}.badge.requesting{background:#fff0cc;color:#9a5b00;border:1px solid #efc56f}.student-row.pending-request td{background:#fffbf1}.student-row.pending-request td:first-child strong{color:#a85f00}.student-row.pending-request:hover td{background:#fff4d8}
    .request-list{display:flex;flex-direction:column;gap:8px}.request{padding:11px;border:1px solid var(--line);border-left:4px solid #aeb7c2;border-radius:10px;background:#fbfcfe}.request.pending{border-left-color:#e2a12d;background:#fffaf0}.request.approved{border-left-color:#38a160;background:#f5fbf7}.request.rejected,.request.cancelled{border-left-color:#d65a50;background:#fff8f7}.request-top{display:flex;gap:8px;align-items:center}.request-top strong{margin-right:auto}.request.pending .request-top strong{color:#9a5b00}.request.approved .request-top strong{color:#13733b}.request.rejected .request-top strong,.request.cancelled .request-top strong{color:#a52a23}.request-meta{margin-top:5px;color:var(--muted);font-size:12px}.empty{padding:24px;text-align:center;color:var(--muted)}
    .notice{padding:11px 13px;border-radius:10px;background:var(--sky);color:#315b91;font-size:12px}.modal{display:none;position:fixed;inset:0;z-index:30;background:rgba(15,25,40,.48);align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.dialog{width:min(520px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.26)}.dialog-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0 auto 0 0;font-size:18px;color:var(--navy)}.close{border:0;background:#eef1f5;border-radius:50%;width:32px;height:32px;cursor:pointer}.form{padding:17px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field.full{grid-column:1/-1}label{display:block;margin-bottom:5px;color:#5c6672;font-size:12px;font-weight:750}input,select,textarea{width:100%;padding:10px;border:1px solid #cfd6df;border-radius:8px;background:#fff}textarea{min-height:70px;resize:vertical}.file-note{font-size:11px;color:var(--muted);margin-top:5px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{display:none;position:fixed;right:18px;bottom:18px;z-index:50;max-width:380px;padding:12px 15px;border-radius:10px;background:#202124;color:#fff;box-shadow:0 7px 25px rgba(0,0,0,.25)}
    @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.profile{display:none}.panel-head{flex-wrap:wrap}.search{width:100%}}@media(max-width:560px){.wrap{padding:11px}.top{padding:13px}.cards{grid-template-columns:1fr 1fr}.card strong{font-size:20px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{flex-wrap:wrap}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">담당 학생 관리 <span class="role-mark">관리 원장님</span></div><div id="profile" class="profile">계정 확인 중...</div><button class="btn soft" onclick="loadData()">새로고침</button></header>
  <main class="wrap">
    <div class="toolbar"><button class="btn soft" onclick="moveMonth('prev')">‹ 이전</button><select id="month" onchange="loadData()"></select><button class="btn soft" onclick="moveMonth('next')">다음 ›</button></div>
    <section id="cards" class="cards"></section>
    <div class="grid">
      <section class="panel">
        <div class="panel-head"><h2>담당 학생</h2><span id="studentCount" class="sub"></span><input id="search" class="search" placeholder="학생명·학년 검색" oninput="renderStudents()"><select id="studentRequestFilter" class="filter-select" onchange="renderStudents()"><option value="ALL">전체 학생</option><option value="PENDING">승인 요청 중</option><option value="NONE">요청 없음</option></select></div>
        <div class="notice">이 화면에서는 실제 수납을 직접 등록하지 않습니다. 입력한 내용은 최고 원장의 확인·승인 후 수납으로 반영됩니다.</div>
        <div class="table-wrap" style="margin-top:11px"><table><thead><tr><th>학생</th><th>학년</th><th>수강료</th><th>납부 상태</th><th>최근 수납</th><th></th></tr></thead><tbody id="students"></tbody></table></div>
      </section>
      <aside>
        <section class="panel"><div class="panel-head"><h2>내 수납 요청</h2><span id="requestCount" class="sub"></span><select id="requestStatusFilter" class="filter-select" onchange="renderRequests()"><option value="ALL">전체 상태</option><option value="PENDING">승인 대기</option><option value="APPROVED">승인 완료</option><option value="REJECTED">반려</option><option value="CANCELLED">취소</option></select></div><div id="requests" class="request-list"></div></section>
        <section class="panel"><div class="panel-head"><h2>업무 범위</h2></div><div class="notice">현재 단계에서는 담당 학생 조회와 수납 승인 요청만 제공합니다. 학생 수정·휴가·형제 처리는 담당 범위 검증을 적용한 뒤 순차적으로 연결됩니다.</div></section>
      </aside>
    </div>
  </main>

  <div id="requestModal" class="modal" onclick="if(event.target===this)closeRequest()"><div class="dialog">
    <div class="dialog-head"><h2>수납 승인 요청</h2><button class="close" onclick="closeRequest()">×</button></div>
    <div class="form"><div class="form-grid">
      <div class="field full"><label>학생</label><input id="studentName" readonly><input id="studentId" type="hidden"></div>
      <div class="field"><label>납부일</label><input id="payDate" type="date"></div><div class="field"><label>귀속월</label><input id="payMonth" type="month"></div>
      <div class="field"><label>수납 항목</label><select id="itemType"><option>수강료</option><option>특강비</option><option>교재비</option><option>기타</option></select></div><div class="field"><label>금액</label><input id="amount" inputmode="numeric" placeholder="원 단위"></div>
      <div class="field full"><label>납부 방식</label><select id="method"></select></div>
      <div class="field full"><label>수납 메모</label><textarea id="memo" placeholder="입금자명이나 확인할 사항"></textarea></div>
      <div class="field full"><label>요청 사유</label><textarea id="reason" placeholder="최고 원장이 확인할 내용"></textarea></div>
      <div class="field full"><label>영수증·납부 증빙</label><input id="evidence" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="file-note">JPG·PNG·WebP, 최대 3장, 한 장당 2MB 이하</div></div>
    </div><div class="actions"><button class="btn soft" onclick="closeRequest()">취소</button><button id="submitBtn" class="btn primary" onclick="submitRequest()">승인 요청</button></div></div>
  </div></div>
  <div id="toast" class="toast"></div>
  <script>
    var state={data:null,students:[],requests:[],month:'',requestId:''};
    function el(id){return document.getElementById(id)}
    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function notify(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._timer);t._timer=setTimeout(function(){t.style.display='none'},3500)}
    function fail(e){var message=(e&&e.message)||String(e||'작업 중 알 수 없는 문제가 발생했습니다.');notify(message+' 입력 내용을 확인한 뒤 다시 시도해주세요. 계속되면 새로고침 후 최고 원장에게 문의해주세요.')}
    function money(v){return Number(v||0).toLocaleString()+'원'}
    function loadData(){var selected=document.getElementById('month').value||state.month;google.script.run.withSuccessHandler(function(d){state.data=d;state.students=d.students||[];state.month=d.targetYm;render(d)}).withFailureHandler(fail).getManagerPortalData(selected)}
    function render(d){state.requests=d.requests||[];document.getElementById('profile').textContent=d.profile.teacherName+' · '+d.profile.email;var options=[d.months.prev,d.months.curr,d.months.next].filter(function(x,i,a){return x&&a.indexOf(x)===i});document.getElementById('month').innerHTML=options.map(function(x){return '<option value="'+x+'" '+(x===d.targetYm?'selected':'')+'>'+x+'</option>'}).join('');var s=d.summary||{};document.getElementById('cards').innerHTML=card('담당 학생',s.total||0)+card('완납',s.complete||0)+card('부분납',s.partial||0)+card('미납·확인',s.unpaid||0)+card('승인 대기',d.pendingCount||0,'pending');document.getElementById('method').innerHTML=(d.paymentMethods||[]).map(function(x){return '<option>'+esc(x)+'</option>'}).join('');renderStudents();renderRequests()}
    function card(label,value,cls){return '<div class="card '+(cls||'')+'"><span>'+esc(label)+'</span><strong>'+esc(value)+'명</strong></div>'}
    function statusClass(v){return v==='완납'?'complete':v==='부분납'?'partial':v==='특강'?'special':'unpaid'}
    function latestPay(student){var rows=student.curr||[];if(!rows.length)return '-';return rows.map(function(x){return (x.date||'')+' '+money(x.amount)}).join(', ')}
    function pendingStudentMap(){var map={};state.requests.forEach(function(x){if(x.status==='PENDING')map[String(x.studentId)]=true});return map}
    function renderStudents(){var q=document.getElementById('search').value.replace(/\s/g,'').toLowerCase();var filter=document.getElementById('studentRequestFilter').value;var pending=pendingStudentMap();var list=state.students.filter(function(x){var matchesText=!q||(String(x.name)+String(x.grade)).replace(/\s/g,'').toLowerCase().indexOf(q)>=0;var hasPending=!!pending[String(x.id)];var matchesRequest=filter==='ALL'||(filter==='PENDING'&&hasPending)||(filter==='NONE'&&!hasPending);return matchesText&&matchesRequest});document.getElementById('studentCount').textContent=list.length+'명';document.getElementById('students').innerHTML=list.length?list.map(function(x){var hasPending=!!pending[String(x.id)];var statusText=x.status==='미납'&&Number(x.unpaidStreak)>=2?Number(x.unpaidStreak)+'달 연속 · 미납':x.status;var statusBadge=hasPending?'<span class="badge requesting" title="현재 계산 상태: '+esc(statusText)+'">승인요청</span>':'<span class="badge '+statusClass(x.status)+'">'+esc(statusText)+'</span>';return '<tr class="student-row '+(hasPending?'pending-request':'')+'"><td><button type="button" class="student-info-link" data-student-modal-id="'+esc(x.id)+'">'+esc(x.name)+'</button></td><td>'+esc(x.grade)+'</td><td class="money">'+money(x.billableFee==null?x.fee:x.billableFee)+'</td><td>'+statusBadge+'</td><td>'+esc(latestPay(x))+'</td><td><button class="btn '+(hasPending?'soft':'primary')+'" onclick="openRequest(\''+esc(x.id)+'\')">'+(hasPending?'추가 요청':'수납 요청')+'</button></td></tr>'}).join(''):'<tr><td colspan="6" class="empty">조건에 맞는 담당 학생이 없습니다.</td></tr>'}
    function renderRequests(){var filter=document.getElementById('requestStatusFilter').value;var list=state.requests.filter(function(x){return filter==='ALL'||x.status===filter});document.getElementById('requestCount').textContent=list.length+(filter==='ALL'?'건':' / 전체 '+state.requests.length+'건');document.getElementById('requests').innerHTML=list.length?list.map(function(x){var text=x.status==='PENDING'?'승인 대기':x.status==='APPROVED'?'승인 완료':x.status==='REJECTED'?'반려':'취소';var cls=x.status==='PENDING'?'pending':x.status==='APPROVED'?'approved':x.status==='REJECTED'?'rejected':'cancelled';return '<div class="request '+cls+'"><div class="request-top"><button type="button" class="student-info-link" data-student-modal-id="'+esc(x.studentId)+'">'+esc(x.studentName)+'</button><span class="badge '+(x.status==='PENDING'?'pending':x.status==='APPROVED'?'complete':'unpaid')+'">'+text+'</span></div><div>'+esc(x.itemType)+' · '+money(x.amount)+'</div><div class="request-meta">'+esc(x.month)+' · '+esc(x.method)+' · 증빙 '+x.evidenceCount+'장<br>'+esc(x.createdAt)+'</div>'+(x.decisionMemo?'<div class="request-meta">처리 메모: '+esc(x.decisionMemo)+'</div>':'')+'</div>'}).join(''):'<div class="empty">선택한 상태의 수납 요청이 없습니다.</div>'}
    function moveMonth(which){if(!state.data)return;var ym=state.data.months[which];if(ym){document.getElementById('month').value=ym;state.month=ym;loadData()}}
    function openRequest(id){var s=state.students.filter(function(x){return String(x.id)===String(id)})[0];if(!s)return;state.requestId='PAYREQ-'+(self.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(16).slice(2));el('studentId').value=s.id;el('studentName').value=s.name;var now=new Date(),local=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);el('payDate').value=local;el('payMonth').value=state.month;el('amount').value=s.billableFee==null?s.fee:s.billableFee;el('memo').value='';el('reason').value='';el('evidence').value='';el('requestModal').classList.add('open')}
    function closeRequest(){el('requestModal').classList.remove('open')}
    function evidenceValidationError(files){files=files||[];if(files.length>3)return'증빙은 최대 3장입니다.';for(var i=0;i<files.length;i++){var file=files[i];if(['image/jpeg','image/png','image/webp'].indexOf(String(file.type||'').toLowerCase())===-1)return'JPG·PNG·WebP 이미지만 첨부할 수 있습니다.';if(!file.size||file.size>2*1024*1024)return'한 장당 2MB 이하만 첨부할 수 있습니다.'}return''}
    function validateEvidenceInput(){var input=el('evidence'),error=evidenceValidationError(Array.prototype.slice.call(input.files||[]));if(error){input.value='';notify(error);return false}return true}
    function readEvidenceFile(file){return new Promise(function(resolve,reject){var reader=new FileReader(),settled=false,timer=setTimeout(function(){if(settled)return;settled=true;try{reader.abort()}catch(ignored){}reject(new Error('이미지 읽기가 지연되어 중단했습니다. 파일을 다시 선택해주세요.'))},15000);function finish(error,value){if(settled)return;settled=true;clearTimeout(timer);if(error)reject(error);else resolve(value)}reader.onload=function(){var base64=String(reader.result||'').split(',')[1]||'';finish(base64?null:new Error('이미지 데이터를 읽지 못했습니다.'),{name:file.name,type:file.type,base64:base64})};reader.onerror=function(){finish(new Error('이미지를 읽지 못했습니다.'))};reader.onabort=function(){finish(new Error('이미지 읽기가 취소되었습니다.'))};try{reader.readAsDataURL(file)}catch(error){finish(new Error('이미지를 읽지 못했습니다.'))}})}
    function readFiles(){var files=Array.prototype.slice.call(el('evidence').files||[]),error=evidenceValidationError(files);if(error)return Promise.reject(new Error(error));return Promise.all(files.map(readEvidenceFile))}
    function submitRequest(){var btn=el('submitBtn'),startedAt=Date.now();btn.disabled=true;readFiles().then(function(files){var data={requestId:state.requestId,studentId:el('studentId').value,payDate:el('payDate').value,month:el('payMonth').value,itemType:el('itemType').value,amount:el('amount').value,method:el('method').value,memo:el('memo').value,reason:el('reason').value,attachments:files};google.script.run.withSuccessHandler(function(r){var metrics=Object.assign({},r&&r.performance||{});metrics.roundTripMs=Date.now()-startedAt;metrics.clientAndTransportMs=Math.max(0,metrics.roundTripMs-Number(metrics.serverMs||0));window.lastManagerRequestPerformance=metrics;console.info('[수납 승인요청 성능]',metrics);btn.disabled=false;closeRequest();notify(r.duplicate?'동일한 승인 대기 요청이 이미 있습니다. 요청 처리 현황에서 확인해주세요.':'승인 요청을 등록했습니다. 요청 처리 현황에서 진행 상태를 확인해주세요.');loadData()}).withFailureHandler(function(e){btn.disabled=false;fail(e)}).submitManagerPaymentRequest(data)}).catch(function(e){btn.disabled=false;fail(e)})}
    window.addEventListener('load',function(){el('evidence').addEventListener('change',validateEvidenceInput);loadData()});
  </script>
<?!= includeHtml_("StudentInfoModalCommon"); ?>
<?!= includeHtml_("AppGlossary"); ?>
</body>
</html>
