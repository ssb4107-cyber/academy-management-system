<!DOCTYPE html><html lang="ko"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--blue:#1a73e8;--navy:#17365d;--soft:#e8f0fe;--line:#dfe5ec;--bg:#f3f6fb;--muted:#657080;--green:#188038;--red:#d93025;--amber:#9a5b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,'Noto Sans KR',sans-serif;color:#202124}.top{display:flex;align-items:center;gap:10px;min-height:72px;padding:15px 22px;background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff}.top-copy{margin-right:auto}.top h1{font-size:21px;margin:0}.top p{margin:4px 0 0;color:rgba(255,255,255,.76);font-size:12px}.top button,.top a{border:0;border-radius:9px;padding:9px 13px;background:rgba(255,255,255,.92);color:#174ea6;text-decoration:none;font-weight:800;cursor:pointer}.wrap{max-width:980px;margin:auto;padding:18px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.summary-card{padding:14px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 3px 12px rgba(40,64,100,.06)}.summary-card span{display:block;color:var(--muted);font-size:11px;font-weight:800}.summary-card strong{display:block;margin-top:5px;color:var(--navy);font-size:22px}.summary-card.pending strong{color:var(--amber)}.toolbar{display:flex;gap:7px;align-items:center;margin-bottom:12px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px}.filter{border:0;border-radius:8px;padding:8px 11px;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}.filter.active{background:var(--soft);color:#174ea6}.guide{margin-left:auto;color:var(--muted);font-size:12px}.card{background:#fff;border:1px solid var(--line);border-left:5px solid #aeb7c2;border-radius:13px;padding:15px 16px;margin-bottom:10px;box-shadow:0 3px 12px rgba(40,64,100,.055)}.card.PENDING,.card.PROCESSING{border-left-color:#e2a12d}.card.APPROVED{border-left-color:#38a160}.card.REJECTED,.card.ERROR{border-left-color:#d65a50}.card.CANCELLED{border-left-color:#8b95a3}.head{display:flex;gap:8px;align-items:center}.kind{display:inline-flex;padding:3px 8px;border-radius:12px;background:var(--soft);color:#174ea6;font-size:11px;font-weight:900}.head strong{margin-right:auto;font-size:16px;color:var(--navy)}.badge{padding:4px 9px;border-radius:12px;background:#fff1c7;color:#805500;font-size:11px;font-weight:900}.badge.APPROVED{background:#e6f4ea;color:#137333}.badge.REJECTED,.badge.ERROR{background:#fce8e6;color:#b3261e}.badge.CANCELLED{background:#eef1f5;color:#586474}.summary-text{margin-top:9px;font-weight:700}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:11px}.memo{margin-top:10px;padding:9px 11px;border-radius:8px;background:#f7f9fc;color:#4f5c6b}.memo.error{background:#fff4f2;color:#a52a23}.actions{display:flex;justify-content:flex-end;margin-top:10px}.cancel{border:1px solid #cfd6df;border-radius:8px;padding:7px 11px;background:#fff;color:#5d6876;font-weight:800;cursor:pointer}.cancel:hover{background:#f6f8fa}.cancel:disabled{opacity:.55;cursor:wait}.empty{text-align:center;color:var(--muted);padding:52px 20px;background:#fff;border:1px dashed #cfd7e2;border-radius:13px}.empty .icon{display:block;font-size:36px;margin-bottom:8px}.loading{opacity:.65;pointer-events:none}@media(max-width:700px){.top{align-items:flex-start;flex-wrap:wrap;padding-left:64px}.top-copy{width:100%}.summary{grid-template-columns:1fr 1fr}.toolbar{overflow:auto}.guide{display:none}.head{align-items:flex-start;flex-wrap:wrap}.head strong{width:100%;order:-1}.wrap{padding:12px}}
</style></head><body><header class="top"><div class="top-copy"><h1>⏳ 요청 처리 현황</h1><p>내가 보낸 변경·수납 요청의 진행 결과를 확인합니다.</p></div><button id="refreshBtn" onclick="load()">새로고침</button><a href="<?= ScriptApp.getService().getUrl() ?>" target="_top">메인</a></header>
<main class="wrap"><section class="summary"><div class="summary-card"><span>전체 요청</span><strong id="countAll">-</strong></div><div class="summary-card pending"><span>처리 대기</span><strong id="countPending">-</strong></div><div class="summary-card"><span>승인 완료</span><strong id="countApproved">-</strong></div><div class="summary-card"><span>반려·오류</span><strong id="countProblem">-</strong></div></section><div class="toolbar" role="tablist" aria-label="요청 상태 필터"><button class="filter active" data-filter="ALL" onclick="setFilter(this)">전체</button><button class="filter" data-filter="PENDING" onclick="setFilter(this)">대기</button><button class="filter" data-filter="APPROVED" onclick="setFilter(this)">승인</button><button class="filter" data-filter="PROBLEM" onclick="setFilter(this)">반려·오류</button><button class="filter" data-filter="CANCELLED" onclick="setFilter(this)">취소</button><span class="guide">대기 요청만 직접 취소할 수 있습니다.</span></div><section id="list"><div class="empty"><span class="icon">⏳</span>요청을 불러오는 중입니다.</div></section></main>
<script>
var rows=[],activeFilter='ALL';function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function stateName(v){return{PENDING:'승인 대기',PROCESSING:'처리 중',APPROVED:'승인 완료',REJECTED:'반려',ERROR:'처리 오류',CANCELLED:'요청 취소'}[v]||'상태 확인 필요'}function typeName(v){return{STUDENT_CREATE:'학생 등록',STUDENT_UPDATE:'학생 정보 변경',VACATION_CREATE:'휴가 등록',VACATION_UPDATE:'휴가 수정',VACATION_DELETE:'휴가 삭제',SIBLING_DISCOUNT:'형제 할인',SIBLING_GROUP:'형제 관계'}[v]||'요청 내용'}
function load(){var btn=document.getElementById('refreshBtn');btn.disabled=true;btn.textContent='불러오는 중';document.body.classList.add('loading');google.script.run.withSuccessHandler(function(data){rows=(data||[]).sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt))});updateCounts();render();btn.disabled=false;btn.textContent='새로고침';document.body.classList.remove('loading')}).withFailureHandler(function(e){var message=(e&&e.message)||String(e||'요청을 불러오지 못했습니다.');document.getElementById('list').innerHTML='<div class="empty"><span class="icon">⚠️</span>'+esc(message)+'<br>아래 ‘다시 시도’를 누르고, 계속되면 Google 계정을 다시 확인해주세요.</div>';btn.disabled=false;btn.textContent='다시 시도';document.body.classList.remove('loading')}).getMyOperationRequests()}
function updateCounts(){document.getElementById('countAll').textContent=rows.length+'건';document.getElementById('countPending').textContent=rows.filter(function(r){return r.status==='PENDING'||r.status==='PROCESSING'}).length+'건';document.getElementById('countApproved').textContent=rows.filter(function(r){return r.status==='APPROVED'}).length+'건';document.getElementById('countProblem').textContent=rows.filter(function(r){return r.status==='REJECTED'||r.status==='ERROR'}).length+'건'}function setFilter(btn){activeFilter=btn.dataset.filter;document.querySelectorAll('.filter').forEach(function(el){el.classList.toggle('active',el===btn)});render()}function matches(r){if(activeFilter==='ALL')return true;if(activeFilter==='PENDING')return r.status==='PENDING'||r.status==='PROCESSING';if(activeFilter==='PROBLEM')return r.status==='REJECTED'||r.status==='ERROR';return r.status===activeFilter}
function render(){var list=rows.filter(matches),box=document.getElementById('list');if(!list.length){box.innerHTML='<div class="empty"><span class="icon">✅</span>이 상태에 해당하는 요청이 없습니다.</div>';return}box.innerHTML=list.map(function(r){var memo=r.error?'<div class="memo error"><b>처리 오류</b><br>'+esc(r.error)+'</div>':r.decisionMemo?'<div class="memo"><b>처리 메모</b><br>'+esc(r.decisionMemo)+'</div>':'';var action=r.canCancel?'<div class="actions"><button class="cancel" data-id="'+esc(r.id)+'" data-category="'+esc(r.category)+'" onclick="cancelReq(this)">요청 취소</button></div>':'';var target=r.studentId?'<button type="button" class="student-info-link" data-student-modal-id="'+esc(r.studentId)+'">'+esc(r.target||'-')+'</button>':'<strong>'+esc(r.target||'-')+'</strong>';return '<article class="card '+esc(r.status)+'"><div class="head"><span class="kind">'+esc(r.category)+'</span>'+target+'<span class="badge '+esc(r.status)+'">'+esc(stateName(r.status))+'</span></div><div class="summary-text">'+esc(r.summary||typeName(r.type))+'</div><div class="meta"><span>'+esc(typeName(r.type))+'</span><span>•</span><span>'+esc(r.createdAt)+'</span></div>'+memo+action+'</article>'}).join('')}
function cancelReq(btn){if(!confirm('아직 처리되지 않은 이 요청을 취소하시겠습니까?'))return;btn.disabled=true;btn.textContent='취소 중';google.script.run.withSuccessHandler(function(){window.top.location.reload()}).withFailureHandler(function(e){var message=(e&&e.message)||String(e||'요청을 취소하지 못했습니다.');alert(message+'\n요청 상태를 새로고침해 확인해주세요. 이미 처리된 요청은 취소할 수 없습니다.');btn.disabled=false;btn.textContent='요청 취소'}).cancelMyOperationRequest(btn.dataset.id,btn.dataset.category)}window.addEventListener('load',load);
</script><?!= includeHtml_("StudentInfoModalCommon"); ?><?!= includeHtml_("AppGlossary"); ?>
</body></html>
